/* ============================ CARD CHIA SẺ (canvas, PNG 1080x1350) ============================ */
const FD=s=>`800 ${s}px "Baloo 2","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`,FS=(w,s)=>`${w} ${s}px "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrapT(c,text,maxW){const out=[];String(text).split("\n").forEach(para=>{let line="";para.split(" ").forEach(w=>{const t=line?line+" "+w:w;if(c.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;});out.push(line);});return out;}
function fitT(c,text,maxW,maxH,fontFn,max,min,lh){
  for(let s=max;s>=min;s-=2){c.font=fontFn(s);const L=wrapT(c,text,maxW);if(L.length*s*lh<=maxH)return{L,s};}
  c.font=fontFn(min);let L=wrapT(c,text,maxW);const n=Math.max(1,Math.floor(maxH/(min*lh)));if(L.length>n){L=L.slice(0,n);L[n-1]=L[n-1].replace(/\s+\S*$/,"")+"…";}return{L,s:min};
}
function symImg(id){return new Promise(res=>{const s=document.getElementById(id);if(!s)return res(null);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">${s.innerHTML}</svg>`;
  const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);});}
async function drawCard(cv,d){
  const W=1080,H=1350,c=cv.getContext("2d");cv.width=W;cv.height=H;
  const win=d.kind==="win",fg=win?"#FFFFFF":"#231E2B",fg2=win?"#FFFFFF":"#4F4858";
  if(win){const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,"#7A52DC");g.addColorStop(1,"#5E36BC");c.fillStyle=g;c.fillRect(0,0,W,H);}
  else{c.fillStyle="#FBF7EF";c.fillRect(0,0,W,H);c.strokeStyle="#E8DFCF";c.lineWidth=4;rrect(c,24,24,W-48,H-48,56);c.stroke();}
  if(document.fonts&&document.fonts.ready)try{await document.fonts.ready;}catch(_){}
  c.textBaseline="alphabetic";c.fillStyle=win?"#FFFFFF":"#5E36BC";c.font=FD(72);c.fillText("NỢ ƠI",72,130);
  const im=await symImg(win?"ch3":"ch1");if(im)c.drawImage(im,W-72-170,56,170,170);
  let y;
  if(!win){
    c.fillStyle=fg;c.font=FD(120);c.fillText("Xin vía hết nợ!",72,370);y=420;
    if(d.total){c.font=FS(700,40);const w=c.measureText("Tổng nợ: "+d.total).width+48;c.fillStyle="#FFE6F0";rrect(c,72,y,w,70,14);c.fill();c.fillStyle="#A31A5A";c.fillText("Tổng nợ: "+d.total,96,y+49);y+=110;}
    const story=d.txt.length>280?d.txt.slice(0,277).trimEnd()+"…":d.txt;
    const f=fitT(c,story,936,d.total?420:500,s=>FS(500,s),48,30,1.5);c.fillStyle=fg2;c.font=FS(500,f.s);
    f.L.forEach((l,i)=>c.fillText(l,72,y+f.s+i*f.s*1.5));y+=f.L.length*f.s*1.5+30;
    c.fillStyle="#5E36BC";c.font=FS(700,40);c.fillText("Xin cộng đồng gửi vía trả nợ thành công 🙏",72,Math.min(y+40,1010));
  }else{
    c.fillStyle=fg;c.font=FS(500,52);c.fillText(d.big==="Hết nợ"?"Hôm nay mình chính thức":"Hôm nay mình đã trả được",72,400);
    c.font=FD(d.big==="Hết nợ"?220:200);c.fillText(d.big==="Hết nợ"?"tự do!":d.big,72,640);
    c.fillStyle="rgba(255,255,255,.28)";rrect(c,72,700,936,40,20);c.fill();
    if(d.pct>0){c.fillStyle="#FFC24B";rrect(c,72,700,Math.max(40,936*d.pct/100),40,20);c.fill();}
    c.font=FS(800,36);const tg="Mốc "+Math.round(d.pct)+"%",tw=c.measureText(tg).width+48;c.fillStyle="#FFC24B";rrect(c,72,770,tw,64,12);c.fill();c.fillStyle="#3B2800";c.fillText(tg,96,815);
    const msg=d.big==="Hết nợ"?"Cảm ơn cả nhà đã gửi vía suốt hành trình!":"Cố lên, mình đang tiến gần hơn đến ngày tự do tài chính!";
    const f=fitT(c,msg,936,200,s=>FS(600,s),52,34,1.4);c.fillStyle="#FFFFFF";c.font=FS(600,f.s);f.L.forEach((l,i)=>c.fillText(l,72,880+f.s+i*f.s*1.4));
  }
  c.fillStyle=win?"#FFFFFF":"#665F6F";c.font=FS(700,36);c.fillText(d.nick,72,1150);
  c.fillStyle=fg2;c.font=FS(600,34);c.fillText(TAGLINE,72,1205);c.font=FS(500,30);c.globalAlpha=.85;c.fillText(HASHTAGS,72,1255);c.globalAlpha=1;
  if(!win&&typeof qrcode==="function"){
    const q=qrcode(0,"M");q.addData(d.url);q.make();const n=q.getModuleCount(),sz=190,x0=W-72-sz-24,y0=1090,m=sz/n;
    c.fillStyle="#FFFFFF";rrect(c,x0-14,y0-14,sz+28,sz+28,20);c.fill();c.fillStyle="#231E2B";
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))c.fillRect(x0+k*m,y0+r*m,Math.ceil(m),Math.ceil(m));
  }
}
let shareSpec=null;
function openShare(spec,title){
  shareSpec=spec;
  openSheet(sheetBody(title||"Tạo thẻ chia sẻ",`<canvas id="shcv" class="shcv" role="img" aria-label="Thẻ chia sẻ NỢ ƠI: ${esc(spec.alt)}"></canvas><p class="ph">Thẻ không hiện thông tin tài khoản thật. ${HASHTAGS}</p>`,
   `<button class="btn pri block" data-a="shDl">${I("download",20)}Tải ảnh PNG</button><div class="sft row2" style="padding:0;border:0"><button class="btn sec" data-a="shShare">${I("share",20)}Chia sẻ</button><button class="btn sec" data-a="shLink">${I("copy",20)}Sao chép liên kết</button></div>`),{onMount:()=>drawCard($("#shcv"),spec)});
}
ACT.share=t=>{
  const p=postBy(t.dataset.id);if(!p)return;
  openShare({kind:"conf",nick:p.nick,txt:p.txt,total:p.pub&&p.debt!=null?short(p.debt):null,url:SITE+"/c/"+p.id,alt:p.txt.slice(0,80)},"Tạo thẻ chia sẻ");
};
ACT.jShare=t=>{
  const j=cur().journey,i=+t.dataset.i;if(!j)return;
  const rep=j.pre+j.pays.slice(0,i+1).reduce((s,x)=>s+x.a,0),pct=Math.min(100,rep/j.initial*100),a=j.pays[i]?j.pays[i].a:rep;
  openShare({kind:"win",nick:acct()?acct().nick:"Ẩn danh",big:pct>=100&&i===j.pays.length-1?"Hết nợ":short(a),pct,url:SITE,alt:"Thành tích trả nợ "+Math.round(pct)+"%"},"Tạo thẻ thành tích");
};
const cvBlob=()=>new Promise(r=>$("#shcv").toBlob(r,"image/png"));
ACT.shDl=async()=>{const b=await cvBlob();const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="no-oi-the-chia-se.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("Đã tải thẻ về máy.");};
ACT.shShare=async()=>{
  try{const b=await cvBlob(),f=new File([b],"no-oi.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:TAGLINE+" "+HASHTAGS});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  ACT.shDl();
};
ACT.shLink=()=>{const ok=()=>toast("Đã sao chép liên kết. Đi khoe với vũ trụ thôi.");try{navigator.clipboard.writeText(shareSpec.url).then(ok,ok);}catch(_){ok();}};

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const f=ACT[t.dataset.a];if(f){if(t.tagName==="A"&&t.getAttribute("href"))return;f(t,e);}
});
function boot(){
  applyTheme();
  const h=location.hash.slice(1);if(S.uid||h==="entered")ui.entered=true;
  if(TABS.some(x=>x[0]===h)){ui.tab=h;ui.entered=true;}
  if(S.uid)ui.entered=true;
  render();
}
window.NoOi={S,ui,go,render,ACT,SCR,cur,openAuth,requireWrite,NET,rebuildCommunity:()=>rebuildCommunity()};
boot();
let rfT=null;
function scheduleRefresh(){
  clearTimeout(rfT);
  rfT=setTimeout(function tick(){
    const sheetOn=$("#sheet").classList.contains("on")||$("#win").classList.contains("on");
    const ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
    if(sheetOn||typing){rfT=setTimeout(tick,1500);return;}
    render({keep:true});
  },150);
}
function rebuildCommunity(){
  const uid=S.uid||(fbUser&&fbUser.uid)||null,cnt={},mine={};
  NET.rawR.forEach(x=>{if(uid&&x.uid===uid)mine[x.pid]=x.k;else(cnt[x.pid]||(cnt[x.pid]=[0,0,0,0,0,0]))[x.k]++;});
  S.posts=NET.rawP.filter(d=>d.status==="visible").map(d=>({id:d.id,nick:d.nick,aid:d.aid,cat:d.cat,debt:d.debt,largest:d.largest,pub:d.pub,ts:d.ts,txt:d.txt,goal:d.goal,freed:!!d.freed,anon:!!d.anon,ch:d.ch,tone:d.tone,r:cnt[d.id]||[0,0,0,0,0,0]}));
  const pids=new Set(S.posts.map(p=>p.id)),okC=NET.rawC.filter(d=>d.status==="visible"&&pids.has(d.pid)),cids=new Set(okC.map(d=>d.id)),cm={};
  okC.forEach(d=>{if(d.parent&&!cids.has(d.parent))return;(cm[d.pid]||(cm[d.pid]=[])).push({id:d.id,parent:d.parent||null,to:d.to||null,aid:d.aid,nick:d.nick,ch:d.ch,tone:d.tone,txt:d.txt,ts:d.ts,anon:!!d.anon});});
  S.comments=cm;
  if(S.uid){const c=cur();c.reacts={};Object.keys(mine).forEach(pid=>{if(REACTIONS[mine[pid]])c.reacts[pid]=REACTIONS[mine[pid]].k;});}
  if(!NET.gotP){NET.gotP=true;Object.keys(ui.ld).forEach(n=>{if(ui.ld[n]==="load"&&!ui.ldT[n])ui.ld[n]=null;});}
  scheduleRefresh();
}
function startCommunity(fb){
  fb.subscribeCommunity({
    posts:l=>{NET.rawP=l;rebuildCommunity();},
    comments:l=>{NET.rawC=l;rebuildCommunity();},
    reactions:l=>{NET.rawR=l;rebuildCommunity();},
    mine:s=>{NET.mine=s;scheduleRefresh();},
    error:()=>{if(!NET.err){NET.err=true;toast("Chưa tải được cộng đồng. Bạn kiểm tra mạng hoặc báo người quản trị nhé.",{ms:6000});}}
  });
}
function initFirebase(){
  const fb=FB();if(!fb||initFirebase.done)return;initFirebase.done=true;startCommunity(fb);
  fb.onAuth(async u=>{
    fbUser=u;
    if(!u){if(S.uid){S.uid=null;ui.entered=false;ui.stack=[];ui.tab="home";save();render({anim:"enter"});}return;}
    try{
      const p=await fb.getProfile(u.uid);if(!p)return;
      const first=S.uid!==u.uid;acctFromProfile(u.uid,u.email,p);
      if(first){S.uid=u.uid;ui.entered=true;save();rebuildCommunity();render({keep:true});}else{save();}
    }catch(_){}
  });
}
window.addEventListener("noifb",initFirebase);initFirebase();


})();
