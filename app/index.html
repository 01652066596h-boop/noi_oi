<style>
/* NỢ ƠI Design System v1.7 - tokens.css
   Dùng chung App và Web. Sáng/tối theo hệ thống hoặc [data-theme="light|dark"].
   Nền tảng: [data-platform="app"] (mặc định) hoặc [data-platform="web"].
   Bốn vai màu của vision: primary tím (gradient hai điểm gần nhau, chỉ ở bề mặt nhấn),
   secondary hồng, nền kem, accent vàng cam. Không gradient trên chữ. */

:root {
  /* ---- Font ---- */
  /* Font tải từ Google Fonts (thẻ link ở head); lỗi mạng thì rơi về font hệ thống bên dưới. */
  --font-sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* Font hiển thị: chỉ cho logo chữ, headline landing, số lớn ở thẻ thành tích. Thiếu font thì rơi về Be Vietnam Pro 800. */
  --font-display: "Baloo 2", "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* ---- Neutral: kem ấm đến than tím ---- */
  --neutral-50:  #FBF7EF;
  --neutral-100: #F6F0E4;
  --neutral-200: #E8DFCF;
  --neutral-300: #D0C8D8;
  --neutral-400: #A9A0B3;
  --neutral-500: #8A8374;
  --neutral-600: #665F6F;
  --neutral-700: #4F4858;
  --neutral-800: #3A3245;
  --neutral-900: #231E2B;
  --neutral-850: #2C2535; /* chỉ dark */
  --neutral-875: #221D2A; /* chỉ dark */
  --neutral-950: #19151F; /* chỉ dark */

  /* ---- Primary: tím ---- */
  --primary-50:  #F0EAFD;
  --primary-100: #E6DCFB;
  --primary-200: #D6C6FA;
  --primary-300: #BBA2F5;
  --primary-400: #9A78EA;
  --primary-500: #7A52DC;
  --primary-600: #6A44CC;
  --primary-700: #5E36BC;
  --primary-800: #4E2AA0;
  --primary-900: #3A1F7A;
  --grad-from-light: #7A52DC;  --grad-to-light: #5E36BC;
  --grad-from-dark:  #7A52DC;  --grad-to-dark:  #7048D0;

  /* ---- Secondary: hồng ---- */
  --pink-50:  #FFE6F0;
  --pink-300: #F7A8CB;
  --pink-600: #C42A6C;
  --pink-700: #A31A5A;
  --pink-950: #3E1830;

  /* ---- Accent: vàng cam ---- */
  --amber-50:  #FFF1CF;
  --amber-300: #FFD27A;
  --amber-400: #FFC24B;
  --amber-800: #7A4B00;
  --amber-900: #3B2800;
  --amber-950: #3A2D0E;
  --orange-50:  #FFEBD9;
  --orange-300: #F7B27A;
  --orange-700: #9A4208;
  --orange-950: #3A2010;

  /* ---- Semantic ---- */
  --green-700: #176B42; --green-50: #E6F4EC; --green-300: #6FD3A0; --green-950: #12291F;
  --red-700: #A8203F; --red-600: #B3203F; --red-50: #FDE8EC; --red-300: #FF9AAE; --red-950: #3A1520;
  --blue-700: #1D5CA8; --blue-50: #E5EFFB; --blue-300: #92C0FF; --blue-950: #12263F;

  /* ---- Vai trò: LIGHT ---- */
  --bg: var(--neutral-50);
  --surface: #FFFFFF;
  --surface-2: var(--neutral-100);
  --border: var(--neutral-200);
  --border-strong: var(--neutral-500);
  --text: var(--neutral-900);
  --text-2: var(--neutral-700);
  --text-3: var(--neutral-600);

  --grad-from: var(--grad-from-light);
  --grad-to: var(--grad-to-light);
  --grad-primary: linear-gradient(135deg, var(--grad-from), var(--grad-to));
  --on-grad: #FFFFFF;
  --primary: var(--primary-700);           /* tím đặc: liên kết, viền, chữ nhấn */
  --primary-hover: var(--primary-800);
  --primary-soft: var(--primary-50);
  --on-primary-soft: var(--primary-800);
  --link: var(--primary-700);
  --focus: var(--primary-700);

  --secondary: var(--pink-600);            /* hồng đặc (nút phụ nhỏ, chấm báo) */
  --on-secondary: #FFFFFF;
  --secondary-soft: var(--pink-50);
  --on-secondary-soft: var(--pink-700);

  --accent: var(--amber-400);              /* vàng cam đặc: milestone, công đức, CTA phụ */
  --on-accent: var(--amber-900);
  --accent-soft: var(--amber-50);
  --on-accent-soft: var(--amber-800);
  --orange-soft: var(--orange-50);
  --on-orange-soft: var(--orange-700);

  --success: var(--green-700);  --success-bg: var(--green-50);
  --warning: var(--amber-800);  --warning-bg: var(--amber-50);
  --danger: var(--red-700);     --danger-bg: var(--red-50);   --danger-solid: var(--red-600);  --on-danger: #FFFFFF;
  --info: var(--blue-700);      --info-bg: var(--blue-50);

  --overlay: rgba(35, 30, 43, .50);
  --skeleton-a: var(--neutral-100);
  --skeleton-b: var(--neutral-200);
  --toast-bg: var(--neutral-900);
  --toast-fg: var(--neutral-50);
  --toast-action: var(--amber-300);

  /* ---- Khoảng cách (thang 4px) ---- */
  --space-0: 0; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px;

  /* ---- Bo góc: thang lớn nhất quán ---- */
  --radius-xs: 6px;     /* tag */
  --radius-sm: 10px;    /* khối con trong thẻ: ô số nợ, bong bóng bình luận, hàng menu */
  --radius-md: 14px;    /* nút, ô nhập */
  --radius-lg: 20px;    /* thẻ bài viết, thẻ nổi bật, banner, modal */
  --radius-xl: 28px;    /* bottom sheet (góc trên), thẻ chia sẻ, khối hero */
  --radius-full: 999px; /* avatar, chip, lượt gửi vía, công tắc, thanh tiến độ */

  /* ---- Elevation ---- */
  --elev-0: none;
  --elev-1: 0 1px 2px rgba(35, 30, 43, .06);
  --elev-2: 0 4px 12px rgba(35, 30, 43, .08);
  --elev-3: 0 12px 32px rgba(35, 30, 43, .16);
  --elev-cta: 0 4px 14px rgba(94, 54, 188, .28); /* chỉ cho nút gradient chính */

  /* ---- Chuyển động ---- */
  --dur-instant: 100ms;
  --dur-fast: 160ms;
  --dur-base: 240ms;
  --dur-slow: 320ms;
  --dur-celebrate: 900ms;
  --ease-standard: cubic-bezier(.2, 0, 0, 1);
  --ease-enter: cubic-bezier(0, 0, .2, 1);
  --ease-exit: cubic-bezier(.4, 0, 1, 1);
  --ease-pop: cubic-bezier(.2, .9, .3, 1.25); /* nảy nhẹ, dùng cho lượt gửi vía */

  /* ---- Vùng chạm, lưới ---- */
  --touch-min: 44px;
  --btn-h: 48px; --btn-h-cta: 56px; --input-h: 52px;
  --app-margin: 16px; --app-width: 390px;
  --web-container: 1200px; --web-gutter: 24px;
  --web-col-left: 240px; --web-col-right: 320px; --web-feed-max: 600px;
  --z-sticky: 20; --z-nav: 30; --z-overlay: 70; --z-sheet: 71; --z-toast: 90;

  /* ---- Chữ: APP ---- */
  --fs-hero: 34px;    --lh-hero: 40px;                 /* font hiển thị: landing */
  --fs-display: 28px; --lh-display: 36px; --fw-display: 800;
  --fs-h1: 24px;      --lh-h1: 32px;      --fw-h1: 700;
  --fs-h2: 20px;      --lh-h2: 28px;      --fw-h2: 700;
  --fs-h3: 17px;      --lh-h3: 24px;      --fw-h3: 600;
  --fs-body: 16px;    --lh-body: 24px;    --fw-body: 400;
  --fs-body-post: 16px; --lh-body-post: 26px;
  --fs-small: 14px;   --lh-small: 20px;   --fw-small: 400;
  --fs-caption: 12px; --lh-caption: 16px; --fw-caption: 500;
  --fs-button: 15px;  --lh-button: 20px;  --fw-button: 700;
  --fs-cta: 15px;     --lh-cta: 20px;                  /* chữ CTA lớn, viết hoa theo nguyên văn */
  --fs-number: 22px;  --lh-number: 28px;  --fw-number: 800;
}

[data-platform="web"] {
  --fs-hero: 56px;    --lh-hero: 62px;
  --fs-display: 40px; --lh-display: 48px;
  --fs-h1: 32px;      --lh-h1: 40px;
  --fs-h2: 24px;      --lh-h2: 32px;
  --fs-h3: 18px;      --lh-h3: 26px;
  --fs-body: 16px;    --lh-body: 26px;
  --fs-small: 14px;   --lh-small: 22px;
  --fs-caption: 13px; --lh-caption: 18px;
  --fs-button: 14px;  --lh-button: 20px;
  --fs-cta: 16px;     --lh-cta: 24px;
  --fs-number: 24px;  --lh-number: 32px;
  --btn-h: 44px; --btn-h-cta: 56px; --input-h: 48px;
}

/* ---- DARK ---- */
:root[data-theme="dark"] {
  --bg: var(--neutral-950);
  --surface: var(--neutral-875);
  --surface-2: var(--neutral-850);
  --border: var(--neutral-800);
  --border-strong: #8B8396;
  --text: #F5F0E8;
  --text-2: var(--neutral-300);
  --text-3: var(--neutral-400);
  --grad-from: var(--grad-from-dark); --grad-to: var(--grad-to-dark);
  --primary: var(--primary-300);
  --primary-hover: var(--primary-200);
  --primary-soft: #2E2447;
  --on-primary-soft: #D6C6FA;
  --link: var(--primary-300);
  --focus: var(--primary-300);
  --secondary: var(--pink-300);
  --on-secondary: #3E1830;
  --secondary-soft: var(--pink-950);
  --on-secondary-soft: var(--pink-300);
  --accent-soft: var(--amber-950);
  --on-accent-soft: var(--amber-300);
  --orange-soft: var(--orange-950);
  --on-orange-soft: var(--orange-300);
  --success: var(--green-300);  --success-bg: var(--green-950);
  --warning: var(--amber-300);  --warning-bg: var(--amber-950);
  --danger: var(--red-300);     --danger-bg: var(--red-950);  --danger-solid: var(--red-300); --on-danger: #3A1520;
  --info: var(--blue-300);      --info-bg: var(--blue-950);
  --overlay: rgba(0, 0, 0, .64);
  --skeleton-a: var(--neutral-850);
  --skeleton-b: var(--neutral-800);
  --toast-bg: #F5F0E8;
  --toast-fg: var(--neutral-950);
  --toast-action: var(--primary-800);
  --elev-1: 0 1px 2px rgba(0, 0, 0, .4);
  --elev-2: 0 4px 12px rgba(0, 0, 0, .45);
  --elev-3: 0 12px 32px rgba(0, 0, 0, .6);
  --elev-cta: 0 4px 14px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--neutral-950); --surface: var(--neutral-875); --surface-2: var(--neutral-850);
    --border: var(--neutral-800); --border-strong: #8B8396;
    --text: #F5F0E8; --text-2: var(--neutral-300); --text-3: var(--neutral-400);
    --grad-from: var(--grad-from-dark); --grad-to: var(--grad-to-dark);
    --primary: var(--primary-300); --primary-hover: var(--primary-200); --primary-soft: #2E2447; --on-primary-soft: #D6C6FA;
    --link: var(--primary-300); --focus: var(--primary-300);
    --secondary: var(--pink-300); --on-secondary: #3E1830; --secondary-soft: var(--pink-950); --on-secondary-soft: var(--pink-300);
    --accent-soft: var(--amber-950); --on-accent-soft: var(--amber-300); --orange-soft: var(--orange-950); --on-orange-soft: var(--orange-300);
    --success: var(--green-300); --success-bg: var(--green-950); --warning: var(--amber-300); --warning-bg: var(--amber-950);
    --danger: var(--red-300); --danger-bg: var(--red-950); --danger-solid: var(--red-300); --on-danger: #3A1520;
    --info: var(--blue-300); --info-bg: var(--blue-950);
    --overlay: rgba(0, 0, 0, .64); --skeleton-a: var(--neutral-850); --skeleton-b: var(--neutral-800);
    --toast-bg: #F5F0E8; --toast-fg: var(--neutral-950); --toast-action: var(--primary-800);
    --elev-1: 0 1px 2px rgba(0, 0, 0, .4); --elev-2: 0 4px 12px rgba(0, 0, 0, .45); --elev-3: 0 12px 32px rgba(0, 0, 0, .6); --elev-cta: 0 4px 14px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}

/* ---- Animation (tên và thông số; chi tiết dùng ở tài liệu mục 8) ---- */
@keyframes noi-reaction-pop   { 0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }          /* 280ms ease-pop */
@keyframes noi-reaction-float { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-28px) scale(1.15); } } /* 600ms ease-enter */
@keyframes noi-count-tick     { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }              /* 160ms ease-enter */
@keyframes noi-fade-up        { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: none; } }              /* 240ms ease-enter */
@keyframes noi-hop            { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } 70% { transform: translateY(0); } 85% { transform: translateY(-4px); } } /* 600ms ease-standard, một lần */
@keyframes noi-confetti       { 0% { opacity: 1; transform: translate(0, -10px) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, 140px)) rotate(var(--rot, 180deg)); } } /* 900ms, 1400ms ở mốc hết nợ */
@keyframes noi-ring           { 0% { opacity: .5; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }              /* 700ms, một lần */
@keyframes noi-badge-in       { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: scale(1); } }                 /* 320ms ease-pop */
@keyframes noi-shimmer        { to { background-position: -200% 0; } }                                                                /* skeleton, 1400ms linear, lặp */

/* ---- Nền tảng truy cập ---- */
html { font-family: var(--font-sans); font-size: 100%; }
body { background: var(--bg); color: var(--text); font-size: var(--fs-body); line-height: var(--lh-body); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  .noi-confetti, .noi-float { display: none !important; }
}

/* ===== NỢ ƠI phiên bản 1.6: component dùng lại từ Design System v1.7 ===== */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;text-align:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
[hidden]{display:none!important}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--text-3)}

/* ---- khung ứng dụng: toàn màn hình trên điện thoại, cột giữa trên máy tính ---- */
.stage{height:100vh;height:100dvh;display:flex;justify-content:center;background:var(--surface-2)}
.phone{--navh:76px;--sab:calc(env(safe-area-inset-bottom,0px) + 6px);position:relative;width:min(100%,480px);height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;isolation:isolate;padding-top:env(safe-area-inset-top,0px);border-left:1px solid var(--border);border-right:1px solid var(--border)}
@media (max-width:520px){.stage{background:var(--bg)}.phone{border:0}}
.main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scr{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative}
.scr::-webkit-scrollbar{display:none}
.scr.enter{animation:noi-fade-up var(--dur-fast) var(--ease-enter)}
.scr.push{animation:noi-slide var(--dur-base) var(--ease-enter)}
@keyframes noi-slide{0%{opacity:0;transform:translateX(28px)}100%{opacity:1;transform:none}}
.pad{padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px}
.pad.nonav{padding-bottom:calc(var(--sab) + 16px)}

/* ---- header, điều hướng ---- */
.ah{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;min-height:52px;padding:4px 8px 4px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.ah.back{padding-left:4px}
.ah h2{flex:1;min-width:0;font-size:var(--fs-h3);line-height:var(--lh-h3);font-weight:var(--fw-h3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ah .sp{flex:1}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:800;font-size:26px;line-height:30px;letter-spacing:-.01em;color:var(--primary)}
.iconbtn{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:var(--radius-md);color:var(--text-2);flex-shrink:0}
.iconbtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--secondary)}
.bnav{display:grid;grid-template-columns:repeat(5,1fr);flex:none;border-top:1px solid var(--border);background:var(--surface);padding:4px 4px var(--sab);z-index:30}
.bnav button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:14px;color:var(--text-3);font-weight:500;border-radius:var(--radius-md);text-align:center}
.bnav button[aria-current=page]{color:var(--primary);font-weight:700}
.bnav button[aria-current=page] .ic{stroke-width:2.1}
.phone.nonav{--navh:0px}
.phone.nonav .bnav{display:none}

/* ---- nút ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--btn-h);min-width:44px;padding:0 20px;border-radius:var(--radius-md);font-size:var(--fs-button);line-height:var(--lh-button);font-weight:var(--fw-button);border:1px solid transparent;text-align:center;transition:background var(--dur-fast) var(--ease-standard),filter var(--dur-fast) var(--ease-standard),transform var(--dur-instant) var(--ease-standard)}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;position:relative}
.btn.sm::after{content:"";position:absolute;inset:-4px 0}
.btn.block{width:100%}
.btn.pri{background:var(--grad-primary);color:var(--on-grad)}
.btn.pri:hover{filter:brightness(.94)}
.btn.cta{min-height:var(--btn-h-cta);padding:8px 20px;border-radius:var(--radius-lg);font-size:var(--fs-cta);line-height:var(--lh-cta);font-weight:800;letter-spacing:.01em;box-shadow:var(--elev-cta)}
.btn.sec{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn.sec:hover{background:var(--surface-2)}
.btn.gho{color:var(--link)}
.btn.gho:hover{background:var(--primary-soft)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.pk{background:var(--secondary-soft);color:var(--on-secondary-soft)}
.btn.dan{background:var(--danger-solid);color:var(--on-danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.load::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- ô nhập ---- */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.lb{font-size:14px;line-height:20px;font-weight:600}
.opt{font-weight:400;color:var(--text-3)}
.in{width:100%;min-height:var(--input-h);padding:0 16px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);color:var(--text);font-size:16px}
textarea.in{padding:14px 16px;min-height:112px;line-height:24px;resize:none;display:block}
.in::placeholder{color:var(--text-3)}
.in:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.in.err{border-color:var(--danger);border-width:2px}
.help{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-3);display:flex;justify-content:space-between;gap:8px}
.help.e{color:var(--danger);font-weight:600;justify-content:flex-start;align-items:center;gap:4px}
.errbox{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-sm);background:var(--danger-bg);color:var(--danger);font-size:14px;line-height:20px;font-weight:600}

/* ---- chip, tag, công tắc ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:2px 0;margin:0}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--radius-full);border:1px solid var(--border-strong);background:var(--surface);font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;flex-shrink:0}
.chips.wrap .chip{white-space:normal;text-align:left}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip[aria-pressed=true]{background:var(--primary-soft);border-color:var(--primary);color:var(--on-primary-soft);font-weight:700}
.chip.pin{border-style:dashed}
.chip.pin.on{border-style:solid;background:var(--primary-soft);border-color:var(--primary);color:var(--on-primary-soft);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-xs);font-size:12px;line-height:16px;font-weight:700;border:1px solid var(--border-strong);color:var(--text-2);white-space:nowrap}
.tag.ok2{background:var(--success-bg);border-color:transparent;color:var(--success)}
.tag.wa{background:var(--warning-bg);border-color:transparent;color:var(--warning)}
.tag.inf{background:var(--info-bg);border-color:transparent;color:var(--info)}
.tag.pk{background:var(--secondary-soft);border-color:transparent;color:var(--on-secondary-soft)}
.tag.am{background:var(--accent-soft);border-color:transparent;color:var(--on-accent-soft)}
.tag.pu{background:var(--primary-soft);border-color:transparent;color:var(--on-primary-soft)}
.sw2{position:relative;width:48px;height:28px;border-radius:14px;background:var(--border-strong);flex-shrink:0}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform var(--dur-fast) var(--ease-standard)}
[aria-checked=true] .sw2,button[aria-checked=true].sw2{background:var(--primary-700)}
[aria-checked=true] .sw2::after,button[aria-checked=true].sw2::after{transform:translateX(20px)}
.row{display:flex;gap:12px;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);width:100%;text-align:left}
.swrow b{display:block;font-size:15px;line-height:22px}
.swrow small{display:block;font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-3)}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode button{min-height:64px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);font-size:14px;line-height:20px;font-weight:600;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode button small{font-weight:400;color:var(--text-3);font-size:12px;line-height:16px}
.mode button[aria-pressed=true]{background:var(--primary-soft);border-color:var(--primary);color:var(--on-primary-soft)}
.mode button[aria-pressed=true] small{color:var(--on-primary-soft)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:var(--radius-md);background:var(--surface-2)}
.seg button{min-height:44px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:var(--text-2);text-align:center}
.seg button[aria-checked=true],.seg button[aria-selected=true]{background:var(--surface);color:var(--primary);box-shadow:var(--elev-1)}
.chk{display:flex;gap:10px;align-items:flex-start;min-height:44px;text-align:left;font-size:14px;line-height:20px;padding:6px 0}
.chk .bx{width:24px;height:24px;border-radius:var(--radius-xs);border:1.5px solid var(--border-strong);display:grid;place-items:center;flex-shrink:0;background:var(--surface);color:transparent}
.chk[aria-checked=true] .bx{background:var(--primary-700);border-color:var(--primary-700);color:#fff}
.lnk{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* ---- thẻ, avatar ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--elev-1)}
.av{border-radius:50%;display:grid;place-items:center;flex-shrink:0;overflow:hidden}
.av.a1{background:var(--primary-soft)}
.av.a2{background:var(--secondary-soft)}
.av.a3{background:var(--accent-soft)}
.av.a4{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.av svg{display:block;fill:none;stroke:none}
.post{padding:16px;display:flex;flex-direction:column;gap:12px}
.post .hd{display:flex;gap:12px;align-items:center}
.post .nm{font-weight:700;font-size:15px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .mt{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-3)}
.post .bd{font-size:var(--fs-body-post);line-height:var(--lh-body-post);white-space:pre-line;overflow-wrap:anywhere}
.post .goal{font-size:14px;line-height:20px;color:var(--text-2)}
.post .goal b{color:var(--text)}
.more{color:var(--link);font-weight:700}
.debt{padding:10px 14px;background:var(--surface-2);border-radius:var(--radius-sm)}
.debt .l{display:flex;align-items:baseline;gap:8px}
.debt small{font-size:var(--fs-caption);color:var(--text-3);font-weight:500}
.debt b{font-size:var(--fs-number);line-height:var(--lh-number);font-weight:var(--fw-number);font-variant-numeric:tabular-nums}
.debt .s{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-3);margin-top:2px}
.rx{display:flex;gap:4px}
.rx button{position:relative;flex:1;min-width:44px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius-md);border:1px solid var(--border);font-size:12px;line-height:14px;color:var(--text-2);background:var(--surface);font-variant-numeric:tabular-nums;text-align:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.rx button .e{font-size:20px;line-height:22px;display:block}
.rx button .e.pop{animation:noi-reaction-pop 280ms var(--ease-pop)}
.rx button .c.tick{animation:noi-count-tick 160ms var(--ease-enter)}
.rx button:hover{background:var(--surface-2)}
.rx button[aria-pressed=true]{background:var(--secondary-soft);border-color:var(--secondary);color:var(--on-secondary-soft);font-weight:700}
.noi-float{position:absolute;left:50%;top:2px;margin-left:-11px;font-size:22px;line-height:24px;pointer-events:none;animation:noi-reaction-float 600ms var(--ease-enter) forwards;z-index:3}
.rxcap{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:-4px;font-size:13px;line-height:18px;color:var(--text-3)}
.rxcap button{position:relative;color:var(--text-3);font-size:13px;line-height:18px;text-align:right}
.rxcap button::after{content:"";position:absolute;inset:-13px -8px}
.rxcap button.on{color:var(--on-secondary-soft);font-weight:700}
.rxfull{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rxfull button{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 12px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);font-size:14px;line-height:18px;text-align:left;font-weight:500}
.rxfull button .e{font-size:22px}
.rxfull button small{display:block;color:var(--text-3);font-size:12px}
.rxfull button[aria-pressed=true]{background:var(--secondary-soft);border-color:var(--secondary);color:var(--on-secondary-soft);font-weight:700}
.act{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:4px;margin-top:-4px}
.act button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:var(--radius-md);font-size:14px;color:var(--text-2);font-weight:500}
.act button:hover{background:var(--surface-2)}
.rep{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:20px;color:var(--text-2)}
.cm{display:flex;gap:8px;padding:6px 0}
.cm .b{background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;line-height:20px;overflow-wrap:anywhere}
.cm .b b{display:block;font-size:13px}
.cm .b i{display:block;font-style:normal;font-size:12px;color:var(--text-3)}
.cm .a{display:flex;gap:4px;font-size:12px;color:var(--text-3);font-weight:600;padding:0 4px;align-items:center}
.cm .a button{min-height:44px;padding:0 8px;color:var(--text-2);font-size:12px;font-weight:700}
.cm .a span{padding:0 8px}
.cm.rp{margin-left:40px;padding-left:8px;border-left:2px solid var(--border)}
.cm.gone{font-size:13px;color:var(--text-3);padding:10px 0}

/* ---- banner ---- */
.banner{display:flex;gap:12px;padding:14px;border-radius:var(--radius-lg);font-size:14px;line-height:20px}
.banner p{color:inherit}
.banner b{display:block;margin-bottom:2px}
.banner .ac{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.banner .btn{min-height:44px}
.banner.saf{background:var(--warning-bg);color:var(--warning)}
.banner.saf .btn.sec{background:transparent;border-color:currentColor;color:inherit}
.banner.nud{background:var(--info-bg);color:var(--info)}
.banner.nud .btn.pri{background:var(--info);color:var(--info-bg)}
.banner.nud .btn.gho{color:inherit}
.banner.day{background:var(--accent-soft);color:var(--on-accent-soft)}
.banner.warn{background:var(--warning-bg);color:var(--warning)}

/* ---- tiến độ, mốc ---- */
.prog{height:12px;border-radius:var(--radius-full);background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.prog>i{display:block;height:100%;background:var(--grad-primary);border-radius:var(--radius-full);transition:width 800ms var(--ease-standard)}
.ticks{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--text-3);margin-top:6px;font-weight:500;gap:4px;font-variant-numeric:tabular-nums}
.ticks .hit{color:var(--on-primary-soft);font-weight:700}
.bigno{font-size:var(--fs-display);line-height:var(--lh-display);font-weight:800;font-variant-numeric:tabular-nums}
.mile{position:relative;text-align:center;padding:20px;border-radius:var(--radius-lg);background:var(--accent-soft);color:var(--on-accent-soft);display:flex;flex-direction:column;align-items:center;gap:6px}
.mile .bd2{position:relative;width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.mile .bd2.fx{animation:noi-badge-in 320ms var(--ease-pop) both}
.mile .bd2.fx::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--accent);animation:noi-ring 700ms var(--ease-enter) 800ms 1 both}
.mile h3{font-family:var(--font-display);font-size:24px;line-height:30px;font-weight:800;color:var(--text)}
.mile p{font-size:14px;line-height:20px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border-radius:var(--radius-sm);background:var(--surface-2);opacity:.5}
.badge.got{opacity:1;background:var(--secondary-soft);color:var(--on-secondary-soft)}
.badge .bi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text-3);flex-shrink:0}
.badge.got .bi{background:var(--secondary);color:var(--on-secondary)}
.badge b{display:block;font-size:13px;line-height:18px}
.badge small{display:block;font-size:12px;line-height:16px}
.tl{display:flex;flex-direction:column}
.tl li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.tl li:last-child{border-bottom:0}
.tl .amt{font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}

/* ---- list, section ---- */
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{font-size:var(--fs-h3);line-height:var(--lh-h3);font-weight:var(--fw-h3)}
.sec>p{font-size:14px;line-height:20px;color:var(--text-2)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.list>.li,.list>a.li{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;width:100%;text-align:left;font-size:15px;line-height:22px;border-bottom:1px solid var(--border)}
.list>.li:last-child{border-bottom:0}
.list>button.li:hover{background:var(--surface-2)}
.li .gr{flex:1;min-width:0}
.li small{display:block;font-size:12px;line-height:16px;color:var(--text-3)}
.li.dn{color:var(--danger)}
.empty{text-align:center;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty h4{font-size:17px;line-height:24px;font-weight:700}
.empty p{font-size:14px;line-height:20px;color:var(--text-2);max-width:280px}
.sk{background:linear-gradient(90deg,var(--skeleton-a),var(--skeleton-b),var(--skeleton-a));background-size:200% 100%;animation:noi-shimmer 1.4s linear infinite;border-radius:var(--radius-sm)}
.doc{display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:24px}
.doc h3{font-size:var(--fs-h3);line-height:var(--lh-h3);margin-top:8px}
.doc ul{display:flex;flex-direction:column;gap:6px;padding-left:18px;list-style:disc}
.who{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;width:100%;text-align:left;border-bottom:1px solid var(--border)}
.who:last-child{border-bottom:0}
.who b{display:block;font-size:14px;line-height:20px}
.who small{display:block;font-size:12px;line-height:16px;color:var(--text-3)}

/* ---- khai nợ ---- */
.dock{position:sticky;bottom:0;z-index:15;padding:12px 16px 12px;background:var(--bg);border-top:1px solid var(--border)}
.tpl{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:var(--radius-full);border:1px dashed var(--border-strong);font-size:13px;white-space:nowrap;color:var(--text-2);flex-shrink:0;position:relative}
.tpl::after{content:"";position:absolute;inset:-4px 0}

/* ---- sheet, toast, màn đã gửi ---- */
.ov{position:absolute;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease-standard);z-index:70}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;transform:translateY(102%);transition:transform var(--dur-base) var(--ease-enter);z-index:71;box-shadow:var(--elev-3);visibility:hidden;outline:0}
.sheet.on{transform:none;visibility:visible}
.sheet.full{height:calc(100% - 24px)}
.sheet .gb{padding:10px 0 4px;flex:none;touch-action:none;cursor:grab}
.sheet .gr{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto}
.sheet .shd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 0 16px;flex:none;min-height:44px}
.sheet .shd h3{font-size:var(--fs-h3);line-height:var(--lh-h3);font-weight:700}
.sheet .sbody{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.sheet .sbody::-webkit-scrollbar{display:none}
.sheet .sft{flex:none;padding:8px 16px calc(var(--sab) + 4px);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border)}
.sheet .sft.row2{flex-direction:row}
.sheet .sft.row2>*{flex:1}
.sheet .li{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;font-size:16px;text-align:left;border-radius:var(--radius-md);padding:0 4px}
.sheet .li:hover{background:var(--surface-2)}
.sheet .li.dn{color:var(--danger)}
.sheet .ph{font-size:14px;line-height:20px;color:var(--text-2)}
.otp{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.toastw{position:absolute;left:16px;right:16px;bottom:calc(var(--navh) + 12px);z-index:90;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity var(--dur-base) var(--ease-enter),transform var(--dur-base) var(--ease-enter)}
.toastw.on{opacity:1;transform:none}
.toastw.on .toast{pointer-events:auto}
.phone.nonav .toastw{bottom:calc(var(--sab) + 12px)}
.toast{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:48px;border-radius:var(--radius-md);background:var(--toast-bg);color:var(--toast-fg);font-size:14px;line-height:20px;box-shadow:var(--elev-3)}
.toast button{margin-left:auto;color:var(--toast-action);font-weight:700;min-height:44px;padding:0 4px}
.win{position:absolute;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;gap:12px;overflow:hidden;border-radius:inherit}
.win.on{display:flex}
.win h2{font-family:var(--font-display);font-size:34px;line-height:38px;font-weight:800}
.win p{font-size:16px;line-height:24px;color:var(--text-2);max-width:300px}
.win .hop{animation:noi-hop 600ms var(--ease-standard) 1}
.win .fadein{animation:noi-fade-up 240ms var(--ease-enter) 200ms both}
.win .btns{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:12px}
.cf{position:absolute;left:50%;top:30%;width:9px;height:6px;border-radius:2px;opacity:0;animation:noi-confetti var(--cfd,900ms) var(--ease-enter) forwards;pointer-events:none;z-index:2}

/* ---- landing ---- */
.land{padding:20px 20px calc(var(--sab) + 16px);display:flex;flex-direction:column;gap:16px;align-items:flex-start;min-height:100%}
.land h1{font-family:var(--font-display);font-size:var(--fs-hero);line-height:var(--lh-hero);font-weight:800;letter-spacing:-.01em}
.land .sub{font-size:16px;line-height:24px;color:var(--text-2)}
.land .cap{font-size:12px;line-height:16px;color:var(--text-3)}
.crowd{display:flex}
.crowd .av{margin-right:-10px;box-shadow:0 0 0 3px var(--bg)}

/* ---- Giải trí ---- */
.fun{padding:16px;display:flex;flex-direction:column;gap:12px}
.fun .top{display:flex;gap:12px;align-items:center}
.fun h3{font-size:var(--fs-h3);line-height:var(--lh-h3);font-weight:var(--fw-h3)}
.fun p{font-size:14px;line-height:20px;color:var(--text-2)}
.incense{position:relative;width:64px;height:64px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft)}
.stick{position:relative;width:4px;height:34px;border-radius:2px;background:var(--on-accent-soft);margin-top:12px}
.stick::before{content:"";position:absolute;top:-4px;left:-1px;width:6px;height:8px;border-radius:50%;background:var(--accent)}
.incense.lit .stick::before{background:var(--secondary);box-shadow:0 0 8px var(--secondary)}
.smoke{position:absolute;top:2px;left:50%;width:2px;height:16px;margin-left:-1px;border-radius:2px;background:var(--text-3);opacity:0}
.incense.burn .smoke{animation:smk 900ms var(--ease-enter) 1 forwards}
@keyframes smk{0%{opacity:.5;transform:translateY(14px) scaleY(.4)}100%{opacity:0;transform:translateY(-6px) scaleY(1.2)}}

<script>var qrcode = function() {
  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {
    var PAD0 = 0xEC;
    var PAD1 = 0x11;
    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];
    var _this = {};
    var makeImpl = function(test, maskPattern) {
      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);
      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);
      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }
      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }
      mapData(_dataCache, maskPattern);
    };
    var setupPositionProbePattern = function(row, col) {
      for (var r = -1; r <= 7; r += 1) {
        if (row + r <= -1 || _moduleCount <= row + r) continue;
        for (var c = -1; c <= 7; c += 1) {
          if (col + c <= -1 || _moduleCount <= col + c) continue;
          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };
    var getBestMaskPattern = function() {
      var minLostPoint = 0;
      var pattern = 0;
      for (var i = 0; i < 8; i += 1) {
        makeImpl(true, i);
        var lostPoint = QRUtil.getLostPoint(_this);
        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }
      return pattern;
    };
    var setupTimingPattern = function() {
      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }
      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };
    var setupPositionAdjustPattern = function() {
      var pos = QRUtil.getPatternPosition(_typeNumber);
      for (var i = 0; i < pos.length; i += 1) {
        for (var j = 0; j < pos.length; j += 1) {
          var row = pos[i];
          var col = pos[j];
          if (_modules[row][col] != null) {
            continue;
          }
          for (var r = -2; r <= 2; r += 1) {
            for (var c = -2; c <= 2; c += 1) {
              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };
    var setupTypeNumber = function(test) {
      var bits = QRUtil.getBCHTypeNumber(_typeNumber);
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };
    var setupTypeInfo = function(test, maskPattern) {
      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);
      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }
      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }
      _modules[_moduleCount - 8][8] = (!test);
    };
    var mapData = function(data, maskPattern) {
      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);
      for (var col = _moduleCount - 1; col > 0; col -= 2) {
        if (col == 6) col -= 1;
        while (true) {
          for (var c = 0; c < 2; c += 1) {
            if (_modules[row][col - c] == null) {
              var dark = false;
              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }
              var mask = maskFunc(row, col - c);
              if (mask) {
                dark = !dark;
              }
              _modules[row][col - c] = dark;
              bitIndex -= 1;
              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }
          row += inc;
          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };
    var createBytes = function(buffer, rsBlocks) {
      var offset = 0;
      var maxDcCount = 0;

/* ============================ KIỂM DUYỆT (bản mẫu chạy ở máy) ============================ */
function moderate(t,ctx){
  if(!t) return null;
  const who=ctx==="comment"?"Bình luận":"Nội dung";
  if(/(https?:\/\/|www\.|\b[a-z0-9-]+\.(com|vn|net|xyz|io|me|link|org)\b|t\.me\/|zalo\.me)/i.test(t)) return who+" có liên kết. NỢ ƠI không cho chèn liên kết, để chặn tin rác và lừa đảo.";
  if(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i.test(t)) return who+" chứa thông tin cá nhân (email). Bạn xóa phần đó rồi gửi lại nhé.";
  if(/(\+?84|0)[\s.\-]?[35789]([\s.\-]?\d){8}(\D|$)/.test(t)) return who+" chứa thông tin cá nhân (số điện thoại, số tài khoản). Bạn xóa phần đó rồi gửi lại nhé.";
  if(/(stk|số tài khoản|cccd|cmnd|căn cước)\s*[:\-]?\s*\d{4,}/i.test(t)) return who+" chứa thông tin cá nhân (số điện thoại, số tài khoản). Bạn xóa phần đó rồi gửi lại nhé.";
  if(/(^|\D)\d{9,19}(?!\s*(đ|d\b|vnd|vnđ|k\b|tr\b|triệu|đồng|tỷ|củ|nghìn))/i.test(t)) return "Có dãy số giống số tài khoản hoặc số giấy tờ. Ghi số tiền thì thêm \"đ\", \"nghìn\" hoặc \"triệu\" nhé.";
  if(/(cho vay|nhận vay|duyệt vay|vay nhanh|lãi suất ưu đãi)/i.test(t)) return who+" có vẻ là rao cho vay. NỢ ƠI không cho rao vay hay mời liên hệ vay ngoài ứng dụng.";
  const norm=" "+t.toLowerCase().replace(/[\s.,!?;:"'()\[\]{}…\-_/\\*~^|<>=+]+/g," ")+" ";
  const hit=[...BANNED_ALL,...(ctx==="comment"?BANNED_CMT:[])].find(w=>norm.includes(" "+w+" "));
  if(hit) return who+" chứa từ ngữ xúc phạm, đe dọa hoặc bêu xấu. Bạn sửa lại rồi gửi nhé.";
  return null;}

let sheetCtx=null,lastFocus=null,sheetTimer=null;

/* ---- confetti ---- */
function confetti(host,n,dur){
  if(rm())return;const cols=["#7A52DC","#C42A6C","#FFC24B"];
  for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";
    s.style.background=cols[i%3];s.style.setProperty("--dx",(Math.random()*180-90)+"px");s.style.setProperty("--dy",(110+Math.random()*90)+"px");
    s.style.setProperty("--rot",(Math.random()*270)+"deg");s.style.setProperty("--cfd",dur+"ms");s.style.animationDelay=Math.floor(Math.random()*180)+"ms";
    host.appendChild(s);setTimeout(()=>s.remove(),dur+400);}
}

function syncReact(id){const fb=FB(),uid=S.uid;if(!fb||!uid)return;const k=cur().reacts[id];const i=k==null?null:REACTIONS.findIndex(r=>r.k===k);fb.setReaction(uid,id,i).catch(()=>toast("Chưa gửi được vía. Bạn thử lại nhé."));}
function applyReact(id,k){
  const c=cur(),prev=c.reacts[id];
  if(prev===k){delete c.reacts[id];save();syncReact(id);refreshPost(id);return;}
  c.reacts[id]=k;save();syncReact(id);refreshPost(id);
  const b=$(`#post-${id} [data-k="${k}"]`);
  if(b){const e=$(".e",b);e.classList.add("pop");const f=document.createElement("span");f.className="noi-float";f.textContent=e.textContent;b.appendChild(f);setTimeout(()=>f.remove(),650);$(".c",b).classList.add("tick");}
  const r=REACTIONS.find(x=>x.k===k);
  toast("Đã gửi vía cho bạn ấy "+r.e,{icon:"check",action:["Hoàn tác",()=>{if(prev)c.reacts[id]=prev;else delete c.reacts[id];save();syncReact(id);refreshPost(id);}]});
}

}

/* ============================ ĐĂNG NHẬP, XÁC THỰC SỐ ĐIỆN THOẠI MUỘN ============================ */
function requireWrite(why,cb,onCancel){
  if(!S.uid){openAuth(why,()=>requireWrite(why,cb,onCancel),onCancel);return;}
  if(!acct().phone){openPhone("write",why,cb,onCancel);return;}
  cb();
}
let authCtx={mode:"login",email:"",terms:false,year:""};
function openAuth(why,onDone,onCancel){
  authCtx={...authCtx,why,onDone,onCancel};
  renderAuth(true);
}
const errBox=m=>`<div class="errbox" role="alert">${I("alert",18)}<span>${m}</span></div>`;
function renderAuth(first){
  const a=authCtx;
  const body=`<p class="ph">${a.why?"Để "+a.why+", bạn cần có tài khoản. Chỉ đọc bài thì không cần đăng nhập.":"Đăng nhập bằng tài khoản Google. Email của bạn không hiển thị với cộng đồng, bạn sẽ có một danh tính ẩn danh riêng."}</p>
  <button class="btn pri block" data-a="google" data-first id="gbtn">${I("globe",20)}Tiếp tục với Google</button>
  <p class="ph" style="font-size:13px">NỢ ƠI dành cho người từ 16 tuổi trở lên. Lần đầu bạn sẽ được hỏi năm sinh.</p>
  <div id="aerr"></div>`;
  openSheet(sheetBody("Đăng nhập",body,`<button class="btn gho block" data-a="closeSheet">Để sau</button>`),{onCancel:a.onCancel});
}
ACT.openAuth=()=>openAuth("",null,null);
function ageErr(y){y=parseInt(y,10);const cy=new Date().getFullYear();if(!y||y<1900||y>cy)return"Năm sinh chưa đúng. Ví dụ: 1998.";if(cy-y<16)return"NỢ ƠI dành cho người từ 16 tuổi trở lên. Bạn chưa thể tạo tài khoản.";return null;}
function acctFromProfile(uid,email,p){
  const ac={id:uid,email:email||"",provider:"google",nick:p.nick,ch:p.ch,tone:p.tone,anon:p.anon,phone:p.phone||null,year:p.year,welcomed:S.accts[uid]?S.accts[uid].welcomed:false};
  S.accts[uid]=ac;if(!S.users[uid])S.users[uid]=newUserData();return ac;
}
function loginAs(a){
  const d=authCtx.onDone;closeSheet({done:true});S.uid=a.id;ui.entered=true;
  if(!a.welcomed){a.welcomed=true;notify("Tài khoản của bạn đã tạo xong. Mã ẩn danh của bạn là "+a.anon+".");}
  save();render({keep:true});toast("Chào bạn, "+esc(a.nick)+".");
  if(d)setTimeout(d,350);
}
/* ---- Firebase: đăng nhập Google, hồ sơ lưu Firestore (users/{uid}) ---- */
const FB=()=>window.NoiFB||null;
let fbUser=null;
const myUid=()=>S.uid||(fbUser&&fbUser.uid)||(FB()&&FB().currentUser()&&FB().currentUser().uid)||null;
function saveProfile(patch){const fb=FB(),uid=myUid();if(fb&&uid)fb.updateProfile(uid,patch).catch(()=>toast("Chưa lưu được thay đổi lên máy chủ."));}
ACT.google=async()=>{
  const fb=FB();if(!fb){toast("Chưa kết nối được dịch vụ đăng nhập. Bạn kiểm tra mạng rồi thử lại nhé.");return;}
  const btn=$("#gbtn");if(btn)btn.disabled=true;setTimeout(()=>{const b=$("#gbtn");if(b&&b.disabled){b.disabled=false;toast("Chưa thấy cửa sổ đăng nhập Google? Bạn mở NỢ ƠI bằng Safari hoặc Chrome (không mở từ biểu tượng ngoài màn hình chính) và cho phép cửa sổ bật lên.",{ms:8000});}},12000);
  try{
    fbUser=await fb.signInGoogle();
    const p=await fb.getProfile(fbUser.uid);
    if(p)return loginAs(acctFromProfile(fbUser.uid,fbUser.email,p));
    openGoogleAge();
  }catch(e){const m=fb.errMsg(e);if(m)toast(m);if(btn)btn.disabled=false;}
};
function openGoogleAge(){
  openSheet(sheetBody("Một câu hỏi nhỏ",`<p class="ph">Đã đăng nhập Google. NỢ ƠI dành cho người từ 16 tuổi trở lên. Email không hiển thị với cộng đồng.</p>
  <div class="fld"><label for="ayr">Năm sinh</label><input class="in" id="ayr" inputmode="numeric" maxlength="4" placeholder="Ví dụ: 1998"></div>
  <button class="chk" role="checkbox" aria-checked="false" data-a="gTerms" id="gt"><span class="bx">${I("check",16)}</span><span>Tôi đồng ý <span class="lnk" data-a="docSheet" data-k="terms">Điều khoản sử dụng</span> và <span class="lnk" data-a="docSheet" data-k="privacy">Chính sách quyền riêng tư</span>.</span></button>
  <div id="aerr"></div>`,`<button class="btn pri block" data-a="googleGo">Tiếp tục</button><button class="btn gho block" data-a="googleCancel">Hủy</button>`),{onCancel:authCtx.onCancel});
}
ACT.gTerms=t=>{const v=t.getAttribute("aria-checked")!=="true";t.setAttribute("aria-checked",v);};
ACT.googleCancel=()=>{const fb=FB();if(fb)fb.signOut().catch(()=>{});closeSheet();};
ACT.googleGo=()=>{
  const fb=FB(),u=fbUser||(fb&&fb.currentUser()),box=$("#aerr");
  if(!fb||!u){box.innerHTML=errBox("Phiên đăng nhập đã hết. Bạn đăng nhập lại nhé.");return;}
  const ae=ageErr($("#ayr").value);
  if(ae){box.innerHTML=errBox(ae);return;}
  if($("#gt").getAttribute("aria-checked")!=="true"){box.innerHTML=errBox("Bạn cần đồng ý Điều khoản sử dụng và Chính sách quyền riêng tư.");return;}
  const btn=document.querySelector('[data-a="googleGo"]');if(btn)btn.disabled=true;
  fb.createProfile(u.uid,{anon:"NO-"+hex6(),nick:rnd(PREFIX)+" #"+num4(),ch:Math.floor(Math.random()*12)+1,tone:Math.floor(Math.random()*4)+1,year:parseInt($("#ayr").value,10)})
    .then(p=>loginAs(acctFromProfile(u.uid,u.email,p)))
    .catch(e=>{if(btn)btn.disabled=false;box.innerHTML=errBox(fb.errMsg(e)||"Chưa tạo được hồ sơ. Bạn thử lại nhé.");});
};
/* ---- xác thực số điện thoại: "Để sau" chỉ khi hành động xem; hành động ghi chỉ có "Quay lại" ---- */
let phCtx=null;
function openPhone(kind,why,onDone,onCancel){phCtx={kind,why,onDone,onCancel,step:"enter",tries:0,phone:""};renderPhone();}
function renderPhone(msg){
  const p=phCtx,write=p.kind==="write",foot=(main,mainA)=>`<button class="btn pri block" data-a="${mainA}">${main}</button><button class="btn ${write?"sec":"gho"} block" data-a="phSkip">${write?"Quay lại":"Để sau"}</button>`;
  let title="Xác thực số điện thoại",body,ft;
  if(p.step==="enter"){
    body=`<p class="ph">${write?`Theo quy định về dịch vụ mạng xã hội, tài khoản cần xác thực số điện thoại trước khi ${p.why||"đăng bài, bình luận hoặc gửi vía"}.`:"Thêm số điện thoại để bình luận lâu dài. Để sau cũng được."} Số này không hiển thị với cộng đồng.</p>
    <div class="fld"><label for="phn">Số điện thoại</label><input class="in" id="phn" type="tel" inputmode="tel" placeholder="Ví dụ: 0912 345 678" value="${esc(p.phone)}"></div>
    <button class="lnk" data-a="phAlt" style="text-align:left;min-height:44px">Tôi không có số điện thoại Việt Nam</button><div id="perr">${msg?errBox(msg):""}</div>`;
    ft=foot("Gửi mã","phSend");
  }else if(p.step==="otp"){
    body=`<p class="ph">Mình đã gửi mã 6 chữ số tới ${maskPhone(p.phone)}.</p>
    <div class="fld"><label for="otp">Mã xác thực</label><input class="in otp" id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="______"><div class="help"><span>Mã mẫu: 123456</span><span id="otpc"></span></div></div><div id="perr">${msg?errBox(msg):""}</div>`;
    ft=foot("Xác thực","phVerify");
  }else{
    title="Dùng số định danh";
    body=`<p class="ph">Nếu bạn không có số điện thoại Việt Nam, có thể dùng số định danh cá nhân. Không cần tải ảnh giấy tờ.</p>
    <div class="fld"><label for="phid">Số định danh cá nhân</label><input class="in" id="phid" inputmode="numeric" maxlength="12" placeholder="12 chữ số"></div><div id="perr">${msg?errBox(msg):""}</div>`;
    ft=foot("Xác thực","phAltGo");
  }
  openSheet(sheetBody(title,body,ft),{onCancel:p.onCancel,onMount:()=>{
    if(p.step==="otp"){let s=30;clearInterval(otpTimer);const c=$("#otpc");const tick=()=>{if(!$("#otpc"))return clearInterval(otpTimer);$("#otpc").innerHTML=s>0?`Gửi lại sau ${s} giây`:`<button class="lnk" data-a="phResend">Gửi lại mã</button>`;s--;};tick();otpTimer=setInterval(tick,1000);}}});
}
ACT.phSkip=()=>closeSheet();
ACT.phAlt=()=>{phCtx.phone=$("#phn").value;phCtx.step="alt";renderPhone();};
ACT.phSend=()=>{const n=normPhone($("#phn").value);phCtx.phone=$("#phn").value;if(!n){$("#perr").innerHTML=errBox("Số điện thoại chưa đúng. Ví dụ: 0912 345 678.");return;}phCtx.phone=n;phCtx.step="otp";phCtx.tries=0;renderPhone();};
ACT.phResend=()=>{phCtx.tries=0;renderPhone();toast("Đã gửi lại mã.");};
function phoneDone(val){
  const d=phCtx.onDone;acct().phone=val;saveProfile({phone:val,verified:true});notify("Tài khoản của bạn đã xác thực số điện thoại.");save();closeSheet({done:true});render({keep:true});toast("Đã xác thực số điện thoại.");if(d)setTimeout(d,350);
}
ACT.phVerify=()=>{
  if($("#otp").value.trim()==="123456")return phoneDone(maskPhone(phCtx.phone));
  phCtx.tries++;if(phCtx.tries>=3){phCtx.step="enter";renderPhone("Bạn nhập sai nhiều lần rồi. Bạn gửi lại mã nhé.");return;}
  $("#perr").innerHTML=errBox("Mã chưa đúng. Bạn còn "+(3-phCtx.tries)+" lần thử.");
};
ACT.phAltGo=()=>{const v=$("#phid").value.replace(/\s/g,"");if(!/^\d{12}$/.test(v)){$("#perr").innerHTML=errBox("Số định danh gồm 12 chữ số.");return;}phoneDone("Định danh ***"+v.slice(-3));};

  <div class="fld"><label for="dtxt">Câu chuyện của tôi</label><textarea class="in" id="dtxt" maxlength="3000" style="min-height:140px" placeholder="Hôm nay tôi chính thức thú nhận với vũ trụ rằng...">${esc(d.txt)}</textarea>
   <div class="help"><span>Kể ngắn thôi, bạn không cần nói hết.</span><span id="dcount">${d.txt.length}/3000</span></div>
   <div class="chips" aria-label="Gợi ý mở đầu">${TEMPLATES.map((t,i)=>`<button class="tpl" data-a="dtpl" data-i="${i}">${esc(t.slice(0,30))}…</button>`).join("")}</div>
   <div id="dcrisis">${crisisBox(d.txt)}</div></div>
  <div class="fld"><label for="dgoal">Mục tiêu trả nợ</label><input class="in" id="dgoal" maxlength="300" placeholder="Ví dụ: Trả hết trước Tết, mỗi tháng 5 triệu" value="${esc(d.goal)}"></div>

  <div class="fld"><span class="lb" id="lmode">Chế độ đăng</span><div class="mode" role="group" aria-labelledby="lmode">
   <button data-a="dmode" data-v="anon" aria-pressed="${d.mode==="anon"}">Ẩn danh hoàn toàn<small>Mỗi bài một tên khác, cộng đồng không thấy hồ sơ của bạn</small></button>
   <button data-a="dmode" data-v="nick" aria-pressed="${d.mode==="nick"}">Biệt danh ngẫu nhiên<small>${a?esc(a.nick):"Biệt danh ngẫu nhiên của bạn"}</small></button></div>

  <div id="perr"></div></div>
  <div class="dock"><button class="btn pri cta block" data-a="submitPost">KHAI NỢ NGAY – GIẢI TỎA TÂM HỒN</button></div>`;
};
function hMoney(n,raw,dflt){if(n==null)return `<span>${dflt}</span>`;if(isNaN(n))return `<span class="e" style="color:var(--danger);font-weight:600">${I("alert",14)}Số tiền chưa đúng. Ví dụ: 12.500.000.</span>`;return `<span>= ${vnd(n)}</span>`;}
function crisisBox(t){return isCrisis(t)?`<div class="banner saf" role="region" aria-label="Hỗ trợ tâm lý">${I("shield")}<div><b>Bạn không phải một mình</b><p>Nếu bạn đang nghĩ đến việc làm hại bản thân, hãy nói với một người thân hoặc người bạn tin tưởng ngay bây giờ. Bạn vẫn có thể đăng bài.</p><div class="ac"><button class="btn sec sm" data-a="support">Xem nơi hỗ trợ</button></div></div></div>`:"";}
document.addEventListener("input",e=>{
  const id=e.target.id,d=cur().draft;
  if(id==="ddebt"){d.debt=e.target.value;const n=parseMoney(d.debt);$("#hdebt").innerHTML=hMoney(n,d.debt,"Bạn không bắt buộc phải khai số nợ.");e.target.classList.toggle("err",isNaN(n));saveDraft();}
  else if(id==="dlarge"){d.largest=e.target.value;const n=parseMoney(d.largest);$("#hlarge").innerHTML=hMoney(n,d.largest,"Khoản nợ lớn nhất của bạn là bao nhiêu? Bạn không bắt buộc phải điền.");e.target.classList.toggle("err",isNaN(n));saveDraft();}
  else if(id==="dtxt"){d.txt=e.target.value;$("#dcount").textContent=d.txt.length+"/3000";$("#dcrisis").innerHTML=crisisBox(d.txt);saveDraft();}
  else if(id==="dgoal"){d.goal=e.target.value;saveDraft();}
  else if(id==="cmt"){cmtState.text=e.target.value;}
  else if(id==="sq"){ui.q=e.target.value;const r=$("#sres");if(r)r.innerHTML=searchRes();}
});

ACT.dtpl=t=>{const d=cur().draft;d.txt=(d.txt?d.txt+"\n":"")+TEMPLATES[+t.dataset.i];save();render({keep:true});};

function perr(m){$("#perr").innerHTML=errBox(m);$("#perr").scrollIntoView({block:"center"});}
ACT.submitPost=()=>{
  const d=cur().draft,txt=d.txt.trim();
  if(txt.length<10)return perr("Kể thêm chút nữa nha, ít nhất 10 ký tự.");
  const n=parseMoney(d.debt),nl=parseMoney(d.largest);
  if(isNaN(n)||isNaN(nl))return perr("Số tiền chưa đúng. Ví dụ: 12.500.000.");
  const m=moderate(txt,"post")||moderate(d.goal,"post");if(m)return perr(m);
  if(d.pub&&n==null&&nl==null)return perr("Bạn chưa nhập số nợ nên chưa có gì để công khai.");
  if(S.uid&&S.posts.filter(p=>isMine(p)&&now()-p.ts<36e5).length>=5)return perr("Bạn đăng hơi nhanh rồi, nghỉ tay một chút nhé.");
  requireWrite("đăng bài",doPost);
};
let lastPost=null;
async function doPost(){
  const c=cur(),d=c.draft,a=acct(),anon=d.mode==="anon",n=parseMoney(d.debt),nl=parseMoney(d.largest);
  const aid=anon?"AN-"+hex6():a.anon;
  const p={id:"p"+now()+hex6(),nick:anon?rnd(ANON)+" #"+num4():a.nick,aid,ch:anon?Math.floor(Math.random()*12)+1:a.ch,tone:anon?Math.floor(Math.random()*4)+1:a.tone,anon,
    cat:d.cat||"other",debt:n,largest:nl,pub:!!d.pub&&(n!=null||nl!=null),txt:d.txt.trim(),goal:d.goal.trim()||null};
  if(p.pub&&p.debt==null){p.debt=nl;p.largest=null;}
  const fb=FB();if(!fb){perr("Chưa kết nối được máy chủ. Bạn kiểm tra mạng rồi thử lại nhé.");return;}
  try{await fb.createPost(S.uid,p);}catch(e){perr(fb.errMsg(e)||"Chưa gửi được bài. Bạn thử lại nhé.");return;}
  lastPost=p.id;c.draft=blankDraft();notify("Bài khai nợ của bạn đã lên sóng.");save();
  ui.sort="new";showWin();
}
function showWin(){
  const w=$("#win");
  w.innerHTML=`<div class="hop">${avN(3,120,3)}</div><h2 class="fadein">Đã gửi!</h2><p class="fadein">Lời thú nhận đã được gửi đến cộng đồng.</p><p class="fadein" style="font-size:14px">Kể ra được là nhẹ người rồi. Cả nhà đã nghe.</p>
  <div class="btns fadein"><button class="btn sec block" data-a="winShare">Tạo thẻ chia sẻ</button><button class="btn gho block" data-a="winHome">Về trang chủ</button></div>`;
  w.classList.add("on");confetti(w,14,900);const f=$("button",w);f&&f.focus();
}
function closeWin(){$("#win").classList.remove("on");ui.stack=[];ui.tab="home";render({anim:"enter"});}
ACT.winHome=()=>closeWin();
ACT.winShare=()=>{closeWin();ACT.share({dataset:{id:lastPost}});};


/* ============================ TRENDING, GIẢI TRÍ ============================ */
function trendPosts(k){
  const v=visible();
  if(k==="viral"){const r=v.filter(p=>now()-p.ts<864e5).sort((a,b)=>SCORE.top(b)-SCORE.top(a));return r.slice(0,5);}
  if(k==="funny")return [...v].sort((a,b)=>SCORE.funny(b)-SCORE.funny(a)).slice(0,5);
  if(k==="inspire")return [...v].sort((a,b)=>SCORE.inspire(b)-SCORE.inspire(a)).slice(0,5);
  if(k==="mile")return v.filter(p=>p.freed);
  return [];
}

  }else if(k==="fun"){
    const c=cur(),qd=c.que&&c.que.d===dayKey(),lit=c.incense&&c.incense.d===dayKey(),md=c.merit&&c.merit.d===dayKey();
    body=`<div class="card fun"><div class="top">${avN(11,64,3)}<div><span class="tag am">Giải trí</span><h3>Xin quẻ đầu tháng</h3></div></div>
    <p>Giải trí cho vui, không phải dự báo. Miễn phí, không có quà ảo.</p>
    <button class="btn acc block ${ui.quing?"load":""}" data-a="que" ${ui.quing?"disabled":""}>${ui.quing?"Đang xin quẻ...":qd?"Xem lại quẻ của bạn":"Xin quẻ"}</button></div>
    <div class="card fun"><div class="top"><div class="incense ${lit?"lit":""} ${ui.burn?"burn":""}" aria-hidden="true"><span class="smoke"></span><span class="stick"></span></div><div><span class="tag am">Giải trí</span><h3>Thắp một nén hương</h3></div></div>
    <p>Hôm nay cả nhà đã thắp <b>${fmt(S.incenseTotal)}</b> nén hương cầu bình an cho những người đang trả nợ. Miễn phí, không quy ra điểm.</p>
    <button class="btn acc block" data-a="incense" ${lit?"disabled":""}>${lit?"Đã thắp hôm nay":"Thắp hương"}</button></div>
    <div class="card fun"><div class="top"><div class="incense" aria-hidden="true" style="color:var(--on-accent-soft)">${I("award",28)}</div><div><span class="tag am">Giải trí</span><h3>Công đức hôm nay</h3></div></div>
    <p>Chọn một việc nhỏ bạn đã làm hôm nay, như gọi hỏi thăm người thân, rồi nhận lời cảm ơn. Miễn phí, không quy ra tiền, không xếp hạng.</p>
    <button class="btn acc block" data-a="merit" ${md?"disabled":""}>${md?"Đã ghi công đức hôm nay":"Ghi công đức"}</button></div>`;
  }else{
    body=feedState("trend",()=>{const ps=trendPosts(k);return ps.length?ps.map(postHTML).join(""):`<div class="card empty">${avN(1,96,1)}<h4>Chưa có bài nào ở đây</h4><p>Bạn quay lại sau nhé, cả nhà đang cố gắng.</p></div>`;});
  }
  return hdr("Trending")+`<div class="pad"><div class="chips" role="group" aria-label="Chủ đề">${TRENDS.map(t=>`<button class="chip" data-a="trendk" data-v="${t[0]}" aria-pressed="${k===t[0]}">${t[1]}</button>`).join("")}</div>${body}</div>`;
};

ACT.que=()=>{
  const c=cur();
  requireWrite("xin quẻ",()=>{

ACT.delGo=async t=>{const id=t.dataset.id,fb=FB();closeSheet({done:true});try{if(fb)await fb.deletePost(id);}catch(e){toast((fb&&fb.errMsg(e))||"Chưa xóa được bài. Bạn thử lại nhé.");return;}render({keep:true});toast("Đã xóa bài.");};


/* ============================ BÌNH LUẬN ============================ */
let cmtState={id:null,replyTo:null,anon:true,text:""};
const QUICK=["Nam mô hết nợ 🙏","Cố lên con nợ ơi 💪","Gửi bạn vía giàu sang 🧧","Mình cũng từng như bạn, sẽ ổn thôi"];
function cmtBody(){
  const id=cmtState.id,b=cur().blocked,cs=cmts(id).filter(c=>!b[c.aid]);
  const roots=cs.filter(c=>!c.parent||!cs.some(x=>x.id===c.parent));
  const item=(c,rep)=>{
    if(cur().reported["c:"+c.id])return `<div class="cm gone ${rep?"rp":""}">Bạn đã báo cáo bình luận này.</div>`;
    const mine=isMine(c);
    return `<div class="cm ${rep?"rp":""}">${avN(c.ch,32,c.tone)}<div style="flex:1;min-width:0"><div class="b"><b>${esc(c.nick)}${mine?' <span style="color:var(--primary);font-weight:600">(bạn)</span>':""}</b>${c.to?`<i>Trả lời ${esc(c.to)}</i>`:""}${esc(c.txt)}</div>
    <div class="a"><span style="font-weight:400">${ago(c.ts)}</span><button data-a="reply" data-c="${c.id}">Trả lời</button>${mine?`<button data-a="delCmt" data-c="${c.id}">Xóa</button>`:`<button data-a="rptCmt" data-c="${c.id}">Báo cáo</button>`}</div></div></div>`;};
  return roots.map(r=>item(r,false)+cs.filter(c=>c.parent===r.id).map(c=>item(c,true)).join("")).join("")||`<div class="empty">${avN(1,96,1)}<p>Chưa có bình luận nào. Bạn mở hàng nhé.</p></div>`;
}
function openComments(id,keepState){
  if(!keepState)cmtState={id,replyTo:null,anon:true,text:""};
  const p=postBy(id),rt=cmtState.replyTo&&cmts(id).find(c=>c.id===cmtState.replyTo);
  const foot=`<div style="display:flex;flex-direction:column;gap:8px;width:100%">${rt?`<div class="between" style="font-size:13px"><span>Đang trả lời <b>${esc(rt.nick)}</b></span><button class="btn gho sm" data-a="cancelReply">Hủy</button></div>`:""}
  <div id="cerr"></div><div class="row" style="align-items:flex-end"><textarea class="in" id="cmt" rows="1" maxlength="1000" style="min-height:48px;flex:1;padding:12px 14px" placeholder="Viết lời động viên tử tế nhé, đừng để lộ số điện thoại hay thông tin cá nhân.">${esc(cmtState.text)}</textarea><button class="btn pri" style="padding:0" data-a="sendCmt" aria-label="Gửi bình luận">${I("send",22)}</button></div>
  <button class="swrow" role="switch" aria-checked="${cmtState.anon}" data-a="cmtAnon" style="min-height:44px;padding:4px 12px"><span><b style="font-size:14px">Bình luận ẩn danh</b><small>${cmtState.anon?"Dùng tên ngẫu nhiên":"Dùng biệt danh của bạn"}</small></span><span class="sw2" aria-hidden="true"></span></button></div>`;
  openSheet(`<div class="shd"><h3 id="shT">Bình luận (${ncm(p)})</h3><button class="iconbtn" data-a="closeSheet" aria-label="Đóng">${I("close")}</button></div>
  <div class="sbody"><p class="ph">Gửi tới ${esc(p.nick)}</p><div class="chips" aria-label="Gợi ý nhanh">${QUICK.map((q,i)=>`<button class="chip" data-a="quick" data-i="${i}">${q}</button>`).join("")}</div><div id="clist">${cmtBody()}</div></div><div class="sft">${foot}</div>`,{full:true});
}
ACT.comments=t=>openComments(t.dataset.id);
ACT.reply=t=>{cmtState.replyTo=t.dataset.c;cmtState.text=($("#cmt")||{}).value||"";openComments(cmtState.id,true);};
ACT.cancelReply=()=>{cmtState.replyTo=null;cmtState.text=($("#cmt")||{}).value||"";openComments(cmtState.id,true);};
ACT.cmtAnon=()=>{cmtState.text=$("#cmt").value;cmtState.anon=!cmtState.anon;openComments(cmtState.id,true);};
ACT.quick=t=>{const q=QUICK[+t.dataset.i];cmtState.text=q;sendCmt();};
ACT.sendCmt=()=>{cmtState.text=$("#cmt").value;sendCmt();};
function sendCmt(){
  const txt=cmtState.text.trim(),id=cmtState.id;if(!txt)return;
  const m=moderate(txt,"comment");if(m){const e=$("#cerr");if(e)e.innerHTML=errBox(m);else openComments(id,true);return;}
  requireWrite("bình luận",async()=>{
    const a=acct(),anon=cmtState.anon,cs=cmts(id),rt=cmtState.replyTo&&cs.find(c=>c.id===cmtState.replyTo),fb=FB();
    const cm={id:"c"+now()+hex6(),pid:id,parent:rt?(rt.parent||rt.id):null,to:rt&&rt.parent?rt.nick:null,aid:anon?"AN-"+hex6():a.anon,nick:anon?rnd(CMTP)+" #"+num4():a.nick,
      ch:anon?Math.floor(Math.random()*12)+1:a.ch,tone:anon?Math.floor(Math.random()*4)+1:a.tone,anon,txt};
    try{if(!fb)throw new Error("nofb");await fb.createComment(S.uid,cm);}catch(e){toast((fb&&fb.errMsg(e))||"Chưa gửi được bình luận. Bạn thử lại nhé.");openComments(id,true);return;}
    cmtState={id,replyTo:null,anon:cmtState.anon,text:""};openComments(id,true);refreshPost(id);
    toast("Bình luận đã gửi. Cảm ơn bạn đã ghé hỏi thăm bạn ấy.");
  },()=>openComments(id,true));
}
ACT.delCmt=t=>openSheet(sheetBody("Xóa bình luận này?",`<p class="ph">Bình luận và các trả lời bên dưới sẽ bị xóa. Bạn không thể khôi phục.</p>`,`<button class="btn dan block" data-a="delCmtGo" data-c="${t.dataset.c}">Xóa bình luận</button><button class="btn gho block" data-a="closeSheet">Hủy</button>`),{onCancel:()=>openComments(cmtState.id,true)});
ACT.delCmtGo=async t=>{closeSheet({done:true});const id=cmtState.id,cid=t.dataset.c,fb=FB();try{if(fb){const mineReplies=cmts(id).filter(c=>c.parent===cid&&isMine(c)).map(c=>c.id);await Promise.all([cid,...mineReplies].map(x=>fb.deleteComment(x)));}}catch(e){toast((fb&&fb.errMsg(e))||"Chưa xóa được bình luận. Bạn thử lại nhé.");return;}openComments(id,true);refreshPost(id);toast("Đã xóa bình luận.");};
ACT.rptCmt=t=>{rpt={type:"cmt",id:t.dataset.c,sel:null,back:()=>openComments(cmtState.id,true)};renderReport();};

const jRepaid=j=>j.pre+j.pays.reduce((s,x)=>s+x.a,0);
const jPct=j=>Math.min(100,jRepaid(j)/j.initial*100);
const markLbl=n=>n===0?"0đ":(vnd(n).length<=12?vnd(n):short(n));
let jf={title:"Từ 300 triệu nợ đến ngày tự do tài chính",initial:"300 triệu",pre:"50 triệu",goal:"Trả hết trong 3 năm",date:dayKey()};
SCR.journey=function(){
  const j=cur().journey;
  if(!j){
    return hdr("Hành trình")+`<div class="pad"><div><h1 style="font-size:var(--fs-h1);line-height:var(--lh-h1);font-weight:var(--fw-h1)">Hành trình hết nợ</h1><p class="muted" style="font-size:14px;margin-top:4px">Không cần giấy tờ. Chỉ mình bạn thấy, trừ khi bạn chia sẻ.</p></div>
    <div class="fld"><label for="jt">Tên hành trình</label><input class="in" id="jt" maxlength="80" value="${esc(jf.title)}"></div>
    <div class="fld"><label for="ji">Tổng nợ ban đầu</label><input class="in" id="ji" inputmode="decimal" value="${esc(jf.initial)}" placeholder="Ví dụ: 300 triệu"></div>
    <div class="fld"><label for="jp">Đã trả đến nay <span class="opt">(không bắt buộc)</span></label><input class="in" id="jp" inputmode="decimal" value="${esc(jf.pre)}" placeholder="Ví dụ: 50 triệu"></div>
    <div class="fld"><label for="jg">Mục tiêu trả nợ <span class="opt">(không bắt buộc)</span></label><input class="in" id="jg" maxlength="200" value="${esc(jf.goal)}"></div>
    <div class="fld"><label for="jd">Ngày bắt đầu</label><input class="in" id="jd" type="date" value="${esc(jf.date)}"></div>
    <div id="jerr"></div><button class="btn pri block" data-a="jStart">Bắt đầu hành trình</button></div>`;
  }
  const rep=jRepaid(j),left=Math.max(0,j.initial-rep),pct=jPct(j),done=pct>=100;
  const from=ui.jPrev!=null?ui.jPrev:pct;
  const marks=[1,2/3,1/3,0].map(f=>Math.round(j.initial*f));
  const badges=[["Cập nhật đầu tiên","Cập nhật tiến độ lần đầu",j.pays.length>0],["Mốc 25%","Đạt 25% hành trình",pct>=25],["Nửa chặng","Đạt 50% hành trình",pct>=50],["Hết nợ","Trả hết khoản nợ",done]];
  return hdr("Hành trình",{right:`<button class="iconbtn" data-a="jMore" aria-label="Tùy chọn hành trình">${I("more")}</button>`})+`<div class="pad">
  ${done?`<div class="mile" role="region" aria-label="Mốc hết nợ"><div class="bd2 ${ui.justDone?"fx":""}"><svg width="52" height="52" viewBox="0 0 64 64" fill="none" stroke="none"><use href="#crown"/></svg></div><h3>Hết nợ rồi!</h3><p>Hôm nay bạn chính thức tự do tài chính. Cả cộng đồng gửi bạn một cái ôm.</p><button class="btn acc" data-a="jShare" data-i="${j.pays.length-1}">Tạo thẻ thành tích</button></div>`:""}
  <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
   <b style="font-size:var(--fs-h3);line-height:var(--lh-h3)">${esc(j.title)}</b>
   <div class="between" style="align-items:flex-end"><div><div class="muted" style="font-size:12px">Còn nợ</div><div class="bigno">${vnd(left)}</div></div><span class="tag pu">${pct.toFixed(pct>0&&pct<10?1:0)}%</span></div>
   <div><div class="prog" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100" aria-label="Tiến độ trả nợ"><i id="jbar" style="width:${from}%"></i></div>
   <div class="ticks">${marks.map((m,i)=>`<span class="${(i===0||pct>=[0,33.3,66.7,100][i])?"hit":""}">${markLbl(m)}</span>`).join("")}</div></div>
   <div class="muted" style="font-size:13px;line-height:18px">${j.goal?"Mục tiêu: "+esc(j.goal)+" · ":""}Bắt đầu ${new Date(j.date).toLocaleDateString("vi-VN")}</div>
   ${done?"":`<button class="btn sec block" data-a="jUpd">Cập nhật tiến độ</button>`}</div>
  <div class="sec"><h3>Lịch sử cập nhật</h3>${j.pays.length?`<div class="card" style="padding:4px 16px"><ul class="tl">${[...j.pays].reverse().map((p,ri)=>`<li><div style="flex:1;min-width:0"><span class="amt">+${vnd(p.a)}</span> <span class="muted" style="font-size:12px">· ${new Date(p.t).toLocaleDateString("vi-VN")}</span>${p.n?`<div style="font-size:14px;color:var(--text-2)">${esc(p.n)}</div>`:""}</div><button class="iconbtn" data-a="jShare" data-i="${j.pays.length-1-ri}" aria-label="Tạo thẻ chia sẻ" style="margin:-6px -12px -6px 0">${I("share",20)}</button></li>`).join("")}</ul></div>`:`<p class="muted" style="font-size:14px">Chưa có cập nhật nào. Trả được một khoản nhỏ cũng là trả.</p>`}</div>
  <div class="sec"><h3>Huy hiệu</h3><div class="badges">${badges.map(b=>`<div class="badge ${b[2]?"got":""}"><span class="bi">${I("award",24)}</span><span><b>${b[0]}</b><small>${b[2]?"Đã đạt":b[1]}</small></span></div>`).join("")}</div></div></div>`;
};

document.addEventListener("input",e=>{const m={jt:"title",ji:"initial",jp:"pre",jg:"goal",jd:"date"}[e.target.id];if(m)jf[m]=e.target.value;});
ACT.jStart=()=>{
  const ini=parseMoney(jf.initial),pre=jf.pre.trim()?parseMoney(jf.pre):0,bad=m=>{$("#jerr").innerHTML=errBox(m);};
  if(!jf.title.trim())return bad("Bạn đặt tên cho hành trình nhé.");
  if(!ini||isNaN(ini)||ini<=0)return bad("Số tiền chưa đúng. Ví dụ: 12.500.000.");
  if(isNaN(pre))return bad("Số tiền chưa đúng. Ví dụ: 12.500.000.");
  if(pre>=ini)return bad("Số đã trả phải nhỏ hơn tổng nợ ban đầu.");
  const m=moderate(jf.title+" "+jf.goal,"post");if(m)return bad(m);
  requireWrite("tạo hành trình",()=>{cur().journey={title:jf.title.trim(),initial:ini,pre,goal:jf.goal.trim(),date:jf.date||dayKey(),pays:[]};save();ui.jPrev=null;render();toast("Đã bắt đầu hành trình. Mỗi bước nhỏ đều tính.");});
};
ACT.jUpd=()=>openSheet(sheetBody("Cập nhật tiến độ",`<div class="fld"><label for="jpa">Số tiền đã trả</label><input class="in" id="jpa" inputmode="decimal" placeholder="Ví dụ: 5 triệu, 500 nghìn"></div><div class="fld"><label for="jpn">Ghi chú <span class="opt">(không bắt buộc)</span></label><input class="in" id="jpn" maxlength="200" placeholder="Ví dụ: Lương về là trả liền"></div><div id="jerr2"></div>`,`<button class="btn pri block" data-a="jPay">Cập nhật tiến độ</button><button class="btn gho block" data-a="closeSheet">Hủy</button>`));
ACT.jPay=()=>{
  const j=cur().journey,a=parseMoney($("#jpa").value),n=$("#jpn").value.trim(),bad=m=>{$("#jerr2").innerHTML=errBox(m);},left=j.initial-jRepaid(j);
  if(!a||isNaN(a)||a<=0)return bad("Số tiền chưa đúng. Ví dụ: 12.500.000.");
  if(a>left)return bad("Số tiền lớn hơn phần nợ còn lại ("+vnd(left)+"). Bạn nhập lại nhé.");
  const m=moderate(n,"post");if(m)return bad(m);
  requireWrite("cập nhật tiến độ",()=>{
    const old=jPct(j);j.pays.push({a,t:now(),n});const nw=jPct(j);ui.jPrev=old;ui.justDone=nw>=100;save();closeSheet({done:true});render();
    if(nw<100)toast(old<25&&nw>=25?"Xong 25% rồi. Khó nhất là bước đầu, bạn qua rồi.":"Đã cập nhật tiến độ.",{action:["Tạo thẻ",()=>ACT.jShare({dataset:{i:j.pays.length-1}})]});
  },()=>ACT.jUpd());
};
