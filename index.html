<meta property="og:description" content="Nợ thì có thật, danh tính thì không. Nơi khai nợ ẩn danh và xin vía hết nợ.">

<style>
/* NỢ ƠI Design System v1.7 - tokens.css
   Dùng chung App và Web. Sáng/tối theo hệ thống hoặc [data-theme="light|dark"].
   Nền tảng: [data-platform="app"] (mặc định) hoặc [data-platform="web"].
   Bốn vai màu của vision: primary tím (gradient hai điểm gần nhau, chỉ ở bề mặt nhấn),
   secondary hồng, nền kem, accent vàng cam. Không gradient trên chữ. */

:root {
  /* ---- Font ---- */
  --font-sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* Be Vietnam Pro và Baloo 2 không nhúng trong file này (chạy offline, không tải từ mạng). Máy có cài thì dùng, không có thì rơi về font hệ thống đã khai báo. */
  /* Font hiển thị: chỉ cho logo chữ, headline landing, số lớn ở thẻ thành tích. Thiếu font thì rơi về Be Vietnam Pro 800. */
  --font-display: "Baloo 2", "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* ---- Neutral: kem ấm đến than tím ---- */
  --neutral-50:  #FBF7EF;
  --neutral-100: #F6F0E4;
  --neutral-200: #E8DFCF;
  --neutral-300: #D0C8D8;
  --neutral-400: #A9A0B3;
  --neutral-500: #8A8374;
  --neutral-600: #665F6F;
  --neutral-700: #4F4858;
  --neutral-800: #3A3245;
  --neutral-900: #231E2B;
  --neutral-850: #2C2535; /* chỉ dark */
  --neutral-875: #221D2A; /* chỉ dark */
  --neutral-950: #19151F; /* chỉ dark */

  /* ---- Primary: tím ---- */
  --primary-50:  #F0EAFD;
  --primary-100: #E6DCFB;
  --primary-200: #D6C6FA;
  --primary-300: #BBA2F5;
  --primary-400: #9A78EA;
  --primary-500: #7A52DC;
  --primary-600: #6A44CC;
  --primary-700: #5E36BC;
  --primary-800: #4E2AA0;
  --primary-900: #3A1F7A;
  --grad-from-light: #7A52DC;  --grad-to-light: #5E36BC;
  --grad-from-dark:  #7A52DC;  --grad-to-dark:  #7048D0;

  /* ---- Secondary: hồng ---- */
  --pink-50:  #FFE6F0;
  --pink-300: #F7A8CB;
  --pink-600: #C42A6C;
  --pink-700: #A31A5A;
  --pink-950: #3E1830;

  /* ---- Accent: vàng cam ---- */
  --amber-50:  #FFF1CF;
  --amber-300: #FFD27A;
  --amber-400: #FFC24B;
  --amber-800: #7A4B00;
  --amber-900: #3B2800;
  --amber-950: #3A2D0E;
  --orange-50:  #FFEBD9;
  --orange-300: #F7B27A;
  --orange-700: #9A4208;
  --orange-950: #3A2010;

  /* ---- Semantic ---- */
  --green-700: #176B42; --green-50: #E6F4EC; --green-300: #6FD3A0; --green-950: #12291F;
  --red-700: #A8203F; --red-600: #B3203F; --red-50: #FDE8EC; --red-300: #FF9AAE; --red-950: #3A1520;
  --blue-700: #1D5CA8; --blue-50: #E5EFFB; --blue-300: #92C0FF; --blue-950: #12263F;

  /* ---- Vai trò: LIGHT ---- */
  --bg: var(--neutral-50);
  --surface: #FFFFFF;
  --surface-2: var(--neutral-100);
  --border: var(--neutral-200);
  --border-strong: var(--neutral-500);
  --text: var(--neutral-900);
  --text-2: var(--neutral-700);
  --text-3: var(--neutral-600);

  --grad-from: var(--grad-from-light);
  --grad-to: var(--grad-to-light);
  --grad-primary: linear-gradient(135deg, var(--grad-from), var(--grad-to));
  --on-grad: #FFFFFF;
  --primary: var(--primary-700);           /* tím đặc: liên kết, viền, chữ nhấn */
  --primary-hover: var(--primary-800);
  --primary-soft: var(--primary-50);
  --on-primary-soft: var(--primary-800);
  --link: var(--primary-700);
  --focus: var(--primary-700);

  --secondary: var(--pink-600);            /* hồng đặc (nút phụ nhỏ, chấm báo) */
  --on-secondary: #FFFFFF;
  --secondary-soft: var(--pink-50);
  --on-secondary-soft: var(--pink-700);

  --accent: var(--amber-400);              /* vàng cam đặc: milestone, công đức, CTA phụ */
  --on-accent: var(--amber-900);
  --accent-soft: var(--amber-50);
  --on-accent-soft: var(--amber-800);
  --orange-soft: var(--orange-50);
  --on-orange-soft: var(--orange-700);

  --success: var(--green-700);  --success-bg: var(--green-50);
  --warning: var(--amber-800);  --warning-bg: var(--amber-50);
  --danger: var(--red-700);     --danger-bg: var(--red-50);   --danger-solid: var(--red-600);  --on-danger: #FFFFFF;
  --info: var(--blue-700);      --info-bg: var(--blue-50);

  --overlay: rgba(35, 30, 43, .50);
  --skeleton-a: var(--neutral-100);
  --skeleton-b: var(--neutral-200);
  --toast-bg: var(--neutral-900);
  --toast-fg: var(--neutral-50);
  --toast-action: var(--amber-300);

  /* ---- Khoảng cách (thang 4px) ---- */
  --space-0: 0; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px;

  /* ---- Bo góc: thang lớn nhất quán ---- */
  --radius-xs: 6px;     /* tag */
  --radius-sm: 10px;    /* khối con trong thẻ: ô số nợ, bong bóng bình luận, hàng menu */
  --radius-md: 14px;    /* nút, ô nhập */
  --radius-lg: 20px;    /* thẻ bài viết, thẻ nổi bật, banner, modal */
  --radius-xl: 28px;    /* bottom sheet (góc trên), thẻ chia sẻ, khối hero */
  --radius-full: 999px; /* avatar, chip, lượt gửi vía, công tắc, thanh tiến độ */

  /* ---- Elevation ---- */
  --elev-0: none;
  --elev-1: 0 1px 2px rgba(35, 30, 43, .06);
  --elev-2: 0 4px 12px rgba(35, 30, 43, .08);
  --elev-3: 0 12px 32px rgba(35, 30, 43, .16);
  --elev-cta: 0 4px 14px rgba(94, 54, 188, .28); /* chỉ cho nút gradient chính */

  /* ---- Chuyển động ---- */
  --dur-instant: 100ms;
  --dur-fast: 160ms;
  --dur-base: 240ms;
  --dur-slow: 320ms;
  --dur-celebrate: 900ms;
  --ease-standard: cubic-bezier(.2, 0, 0, 1);
  --ease-enter: cubic-bezier(0, 0, .2, 1);
  --ease-exit: cubic-bezier(.4, 0, 1, 1);
  --ease-pop: cubic-bezier(.2, .9, .3, 1.25); /* nảy nhẹ, dùng cho lượt gửi vía */

  /* ---- Vùng chạm, lưới ---- */
  --touch-min: 44px;
  --btn-h: 48px; --btn-h-cta: 56px; --input-h: 52px;
  --app-margin: 16px; --app-width: 390px;
  --web-container: 1200px; --web-gutter: 24px;
  --web-col-left: 240px; --web-col-right: 320px; --web-feed-max: 600px;
  --z-sticky: 20; --z-nav: 30; --z-overlay: 70; --z-sheet: 71; --z-toast: 90;

  /* ---- Chữ: APP ---- */
  --fs-hero: 34px;    --lh-hero: 40px;                 /* font hiển thị: landing */
  --fs-display: 28px; --lh-display: 36px; --fw-display: 800;
  --fs-h1: 24px;      --lh-h1: 32px;      --fw-h1: 700;
  --fs-h2: 20px;      --lh-h2: 28px;      --fw-h2: 700;
  --fs-h3: 17px;      --lh-h3: 24px;      --fw-h3: 600;
  --fs-body: 16px;    --lh-body: 24px;    --fw-body: 400;
  --fs-body-post: 16px; --lh-body-post: 26px;
  --fs-small: 14px;   --lh-small: 20px;   --fw-small: 400;
  --fs-caption: 12px; --lh-caption: 16px; --fw-caption: 500;
  --fs-button: 15px;  --lh-button: 20px;  --fw-button: 700;
  --fs-cta: 15px;     --lh-cta: 20px;                  /* chữ CTA lớn, viết hoa theo nguyên văn */
  --fs-number: 22px;  --lh-number: 28px;  --fw-number: 800;
}

[data-platform="web"] {
  --fs-hero: 56px;    --lh-hero: 62px;
  --fs-display: 40px; --lh-display: 48px;
  --fs-h1: 32px;      --lh-h1: 40px;
  --fs-h2: 24px;      --lh-h2: 32px;
  --fs-h3: 18px;      --lh-h3: 26px;
  --fs-body: 16px;    --lh-body: 26px;
  --fs-small: 14px;   --lh-small: 22px;
  --fs-caption: 13px; --lh-caption: 18px;
  --fs-button: 14px;  --lh-button: 20px;
  --fs-cta: 16px;     --lh-cta: 24px;
  --fs-number: 24px;  --lh-number: 32px;
  --btn-h: 44px; --btn-h-cta: 56px; --input-h: 48px;
}

/* ---- DARK ---- */
:root[data-theme="dark"] {
  --bg: var(--neutral-950);
  --surface: var(--neutral-875);
  --surface-2: var(--neutral-850);
  --border: var(--neutral-800);
  --border-strong: #8B8396;
  --text: #F5F0E8;
  --text-2: var(--neutral-300);
  --text-3: var(--neutral-400);
  --grad-from: var(--grad-from-dark); --grad-to: var(--grad-to-dark);
  --primary: var(--primary-300);
  --primary-hover: var(--primary-200);
  --primary-soft: #2E2447;
  --on-primary-soft: #D6C6FA;
  --link: var(--primary-300);
  --focus: var(--primary-300);
  --secondary: var(--pink-300);
  --on-secondary: #3E1830;
  --secondary-soft: var(--pink-950);
  --on-secondary-soft: var(--pink-300);
  --accent-soft: var(--amber-950);
  --on-accent-soft: var(--amber-300);
  --orange-soft: var(--orange-950);
  --on-orange-soft: var(--orange-300);
  --success: var(--green-300);  --success-bg: var(--green-950);
  --warning: var(--amber-300);  --warning-bg: var(--amber-950);
  --danger: var(--red-300);     --danger-bg: var(--red-950);  --danger-solid: var(--red-300); --on-danger: #3A1520;
  --info: var(--blue-300);      --info-bg: var(--blue-950);
  --overlay: rgba(0, 0, 0, .64);
  --skeleton-a: var(--neutral-850);
  --skeleton-b: var(--neutral-800);
  --toast-bg: #F5F0E8;
  --toast-fg: var(--neutral-950);
  --toast-action: var(--primary-800);
  --elev-1: 0 1px 2px rgba(0, 0, 0, .4);
  --elev-2: 0 4px 12px rgba(0, 0, 0, .45);
  --elev-3: 0 12px 32px rgba(0, 0, 0, .6);
  --elev-cta: 0 4px 14px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--neutral-950); --surface: var(--neutral-875); --surface-2: var(--neutral-850);
    --border: var(--neutral-800); --border-strong: #8B8396;
    --text: #F5F0E8; --text-2: var(--neutral-300); --text-3: var(--neutral-400);
    --grad-from: var(--grad-from-dark); --grad-to: var(--grad-to-dark);
    --primary: var(--primary-300); --primary-hover: var(--primary-200); --primary-soft: #2E2447; --on-primary-soft: #D6C6FA;
    --link: var(--primary-300); --focus: var(--primary-300);
    --secondary: var(--pink-300); --on-secondary: #3E1830; --secondary-soft: var(--pink-950); --on-secondary-soft: var(--pink-300);
    --accent-soft: var(--amber-950); --on-accent-soft: var(--amber-300); --orange-soft: var(--orange-950); --on-orange-soft: var(--orange-300);
    --success: var(--green-300); --success-bg: var(--green-950); --warning: var(--amber-300); --warning-bg: var(--amber-950);
    --danger: var(--red-300); --danger-bg: var(--red-950); --danger-solid: var(--red-300); --on-danger: #3A1520;
    --info: var(--blue-300); --info-bg: var(--blue-950);
    --overlay: rgba(0, 0, 0, .64); --skeleton-a: var(--neutral-850); --skeleton-b: var(--neutral-800);
    --toast-bg: #F5F0E8; --toast-fg: var(--neutral-950); --toast-action: var(--primary-800);
    --elev-1: 0 1px 2px rgba(0, 0, 0, .4); --elev-2: 0 4px 12px rgba(0, 0, 0, .45); --elev-3: 0 12px 32px rgba(0, 0, 0, .6); --elev-cta: 0 4px 14px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}

/* ---- Animation (tên và thông số; chi tiết dùng ở tài liệu mục 8) ---- */
@keyframes noi-reaction-pop   { 0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }          /* 280ms ease-pop */
@keyframes noi-reaction-float { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-28px) scale(1.15); } } /* 600ms ease-enter */
@keyframes noi-count-tick     { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }              /* 160ms ease-enter */
@keyframes noi-fade-up        { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: none; } }              /* 240ms ease-enter */
@keyframes noi-hop            { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } 70% { transform: translateY(0); } 85% { transform: translateY(-4px); } } /* 600ms ease-standard, một lần */
@keyframes noi-confetti       { 0% { opacity: 1; transform: translate(0, -10px) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, 140px)) rotate(var(--rot, 180deg)); } } /* 900ms, 1400ms ở mốc hết nợ */
@keyframes noi-ring           { 0% { opacity: .5; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }              /* 700ms, một lần */
@keyframes noi-badge-in       { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: scale(1); } }                 /* 320ms ease-pop */
@keyframes noi-shimmer        { to { background-position: -200% 0; } }                                                                /* skeleton, 1400ms linear, lặp */

/* ---- Nền tảng truy cập ---- */
html { font-family: var(--font-sans); font-size: 100%; }
body { background: var(--bg); color: var(--text); font-size: var(--fs-body); line-height: var(--lh-body); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  .noi-confetti, .noi-float { display: none !important; }
}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chv{fill:none;stroke:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--btn-h);min-width:44px;padding:0 20px;border-radius:var(--radius-md);font-size:var(--fs-button);line-height:var(--lh-button);font-weight:700;border:1px solid transparent;text-align:center;transition:background var(--dur-fast) var(--ease-standard),filter var(--dur-fast) var(--ease-standard),transform var(--dur-instant) var(--ease-standard)}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;position:relative}.btn.sm::after{content:"";position:absolute;inset:-4px 0}
.btn.block{width:100%}
.btn.pri{background:var(--grad-primary);color:var(--on-grad)}
.btn.pri:hover,.btn.pri.hov{filter:brightness(.94)}.btn.pri:active,.btn.pri.prs{filter:brightness(.86)}
.btn.cta{min-height:var(--btn-h-cta);padding:8px 20px;border-radius:var(--radius-lg);font-size:var(--fs-cta);line-height:var(--lh-cta);font-weight:800;letter-spacing:.01em;box-shadow:var(--elev-cta)}
.btn.sec2{background:var(--surface);border-color:var(--border-strong);color:var(--text)}.btn.sec2:hover,.btn.sec2.hov{background:var(--surface-2)}.btn.sec2:active,.btn.sec2.prs{background:var(--border)}
.btn.gho{color:var(--link)}.btn.gho:hover,.btn.gho.hov{background:var(--primary-soft)}.btn.gho:active,.btn.gho.prs{background:var(--primary-100);color:var(--primary-800)}
.btn.acc{background:var(--accent);color:var(--on-accent)}.btn.acc:hover,.btn.acc.hov{filter:brightness(.95)}
.btn.pk{background:var(--secondary-soft);color:var(--on-secondary-soft)}
.btn.dan{background:var(--danger-solid);color:var(--on-danger)}.btn.dan:hover{filter:brightness(.92)}
.btn.foc{outline:2px solid var(--focus);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.load::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fld{display:flex;flex-direction:column;gap:6px}.fld label{font-size:14px;line-height:20px;font-weight:600}
.opt{font-weight:400;color:var(--text-3)}
.in{width:100%;min-height:var(--input-h);padding:0 16px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);color:var(--text);font-size:16px}
textarea.in{padding:14px 16px;min-height:112px;line-height:24px;resize:vertical}
.in::placeholder{color:var(--text-3)}.in:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.in.err{border-color:var(--danger);border-width:2px}
.help{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-3);display:flex;justify-content:space-between;gap:8px}
.help.e{color:var(--danger);font-weight:600;justify-content:flex-start;align-items:center;gap:4px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--radius-full);border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip[aria-pressed=true]{background:var(--primary-soft);border-color:var(--primary);color:var(--on-primary-soft);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-xs);font-size:12px;line-height:16px;font-weight:700;border:1px solid var(--border-strong);color:var(--text-2)}
.tag.ok2{background:var(--success-bg);border-color:transparent;color:var(--success)}.tag.wa{background:var(--warning-bg);border-color:transparent;color:var(--warning)}.tag.inf{background:var(--info-bg);border-color:transparent;color:var(--info)}
.tag.pk{background:var(--secondary-soft);border-color:transparent;color:var(--on-secondary-soft)}.tag.am{background:var(--accent-soft);border-color:transparent;color:var(--on-accent-soft)}.tag.or{background:var(--orange-soft);border-color:transparent;color:var(--on-orange-soft)}.tag.pu{background:var(--primary-soft);border-color:transparent;color:var(--on-primary-soft)}
.av{border-radius:50%;display:grid;place-items:center;flex-shrink:0;overflow:hidden}
.av.a1{background:var(--primary-soft)}.av.a2{background:var(--secondary-soft)}.av.a3{background:var(--accent-soft)}.av.a4{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--elev-1)}
.post{padding:16px}
.post .hd{display:flex;gap:12px;align-items:center}
.post .nm{font-weight:700;font-size:15px;line-height:20px}

.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--radius-md);color:var(--text-2);position:relative}.iconbtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--secondary)}
.rx{display:flex;gap:4px;margin-top:12px}

.rx button .e{font-size:20px;line-height:22px;display:block}.rx button .e.pop{animation:noi-reaction-pop 280ms var(--ease-pop)}
.rx button .c.tick{animation:noi-count-tick 160ms var(--ease-enter)}
.rx button:hover{background:var(--surface-2)}
.rx button[aria-pressed=true]{background:var(--secondary-soft);border-color:var(--secondary);color:var(--on-secondary-soft);font-weight:700}
.noi-float{position:absolute;left:50%;top:2px;margin-left:-11px;font-size:22px;line-height:24px;pointer-events:none;animation:noi-reaction-float 600ms var(--ease-enter) forwards;z-index:3}
.rxcap{margin-top:8px;font-size:13px;line-height:18px;color:var(--text-3);min-height:18px}
.rxfull{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rxfull button{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);font-size:14px;text-align:left;font-weight:500}
.rxfull button .e{font-size:22px}
.rxfull button[aria-pressed=true]{background:var(--secondary-soft);border-color:var(--secondary);color:var(--on-secondary-soft);font-weight:700}
.act{display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:8px;padding-top:4px}
.act button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:var(--radius-md);font-size:14px;color:var(--text-2);font-weight:500}.act button:hover{background:var(--surface-2)}
.cm{display:flex;gap:8px;padding:6px 0}.cm .b{background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;line-height:20px}.cm .b b{display:block;font-size:13px}
.cm .a{display:flex;gap:16px;font-size:12px;color:var(--text-3);font-weight:600;padding:4px 12px 0}
.cm.rp{margin-left:40px;padding-left:8px;border-left:2px solid var(--border)}
.banner{display:flex;gap:12px;padding:14px;border-radius:var(--radius-lg);font-size:14px;line-height:20px}
.banner.saf{background:var(--warning-bg);color:var(--warning)}.banner.nud{background:var(--info-bg);color:var(--info)}.banner.day{background:var(--accent-soft);color:var(--on-accent-soft)}
.banner p{color:inherit}.banner b{display:block;margin-bottom:2px}.banner .ac{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.banner .btn{min-height:44px}
.banner.saf .btn.sec2{background:transparent;border-color:currentColor;color:inherit}
.banner.nud .btn.pri{background:var(--info);color:var(--info-bg)}.banner.nud .btn.gho{color:inherit}
.partner{padding:16px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.partner .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.partner h4{font-size:15px;line-height:22px;font-weight:700}
.partner p{font-size:13px;line-height:18px;color:var(--text-3);margin:4px 0 12px}
.prog{height:12px;border-radius:var(--radius-full);background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.prog>i{display:block;height:100%;background:var(--grad-primary);border-radius:var(--radius-full);transition:width 800ms var(--ease-standard)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:6px;font-weight:500;gap:4px}.ticks .hit{color:var(--on-primary-soft);font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}.steps li{display:flex;gap:12px;align-items:center;font-size:14px}
.steps .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--border-strong);color:var(--text-3);font-size:12px;font-weight:700}
.steps .done .d{background:var(--success);border-color:transparent;color:var(--surface)}.steps .cur .d{border:2px solid var(--primary);color:var(--primary)}
.empty{text-align:center;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty h4{font-size:17px;line-height:24px;font-weight:700}.empty p{font-size:14px;line-height:20px;color:var(--text-2);max-width:280px}
.sk{background:linear-gradient(90deg,var(--skeleton-a),var(--skeleton-b),var(--skeleton-a));background-size:200% 100%;animation:noi-shimmer 1.4s linear infinite;border-radius:var(--radius-sm)}
.toast{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:48px;border-radius:var(--radius-md);background:var(--toast-bg);color:var(--toast-fg);font-size:14px;line-height:20px;box-shadow:var(--elev-3)}
.toast button{margin-left:auto;color:var(--toast-action);font-weight:700;min-height:44px;padding:0 4px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:24px;line-height:28px;letter-spacing:-.01em}
.sw2{position:relative;width:48px;height:28px;border-radius:14px;background:var(--border-strong);flex-shrink:0}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform var(--dur-fast) var(--ease-standard)}
button[aria-checked=true].sw2{background:var(--primary-700)}button[aria-checked=true].sw2::after{transform:translateX(20px)}
.seg{display:flex;gap:8px;overflow:auto;padding:2px}.segw{flex-wrap:wrap}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode button{min-height:48px;padding:8px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);font-size:14px;font-weight:600;text-align:left}
.mode button[aria-pressed=true]{background:var(--primary-soft);border-color:var(--primary);color:var(--on-primary-soft)}
.cf{position:absolute;left:50%;top:28%;width:9px;height:6px;border-radius:2px;opacity:0;animation:noi-confetti var(--cfd,900ms) var(--ease-enter) forwards;pointer-events:none}
.mile{position:relative;text-align:center;padding:20px;border-radius:var(--radius-lg);background:var(--accent-soft);color:var(--on-accent-soft);display:none}.mile.on{display:block}
.mile .bd2{position:relative;width:72px;height:72px;margin:0 auto 8px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;animation:noi-badge-in 320ms var(--ease-pop) both}
.mile .bd2::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--accent);animation:noi-ring 700ms var(--ease-enter) 1 both}
.mile h4{font-family:var(--font-display);font-size:26px;line-height:30px;font-weight:800;color:var(--text)}.mile p{font-size:14px;line-height:20px;margin-top:4px}
.crowd{display:flex}.crowd .av{margin-right:-10px;box-shadow:0 0 0 3px var(--bg)}
.tr{display:flex;gap:12px;align-items:center;min-height:44px;font-size:14px}.tr .n{width:20px;color:var(--text-3);font-weight:700}
.menu{width:240px;padding:6px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--border);box-shadow:var(--elev-2)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);font-size:14px;text-align:left}.menu button:hover{background:var(--surface-2)}.menu .dn{color:var(--danger)}
/* ===== Bố cục Web NỢ ƠI ===== */
:root{--demo-h:0px}
html{scroll-behavior:smooth}
body{min-height:100vh}
a{color:var(--link)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--surface);padding:10px 16px;border-radius:var(--radius-md);border:2px solid var(--focus)}
.skip:focus{top:8px}
.muted{color:var(--text-3)}
.row2{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}


/* khung ứng dụng */
.app{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:72px minmax(0,1fr);align-items:start;min-height:calc(100vh - var(--demo-h))}
.side{position:sticky;top:var(--demo-h);height:calc(100vh - var(--demo-h));padding:20px 12px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--border);overflow:auto}
.side .logo{padding:0 8px;min-height:44px}
.side .logo span.t{display:none}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a,.side nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--radius-md);font-size:15px;font-weight:500;color:var(--text-2);text-decoration:none;width:100%;text-align:left}
.side nav a:hover,.side nav button:hover{background:var(--surface-2)}
.side nav a[aria-current=page]{background:var(--primary-soft);color:var(--on-primary-soft);font-weight:700}
.side nav a[aria-current=page] .ic{stroke-width:2.1}
.side .lb{display:none}
.side .acct{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side .me{display:flex;gap:12px;align-items:center;padding:8px;border-radius:var(--radius-md);min-height:48px;width:100%;text-align:left}
.side .me:hover{background:var(--surface-2)}
.side .me .nm{font-size:14px;line-height:18px;font-weight:700;display:block}
.side .me small{font-size:12px;color:var(--text-3);display:block}
.side .lk{display:none;flex-wrap:wrap;gap:4px 12px;padding:0 8px;font-size:12px}
.side .lk a,.side .lk button{color:var(--text-3);font-size:12px;text-decoration:underline;min-height:24px}
.main{min-width:0;padding:0 20px 40px}
.col-c{max-width:680px;margin:0 auto}
.wh{position:sticky;top:var(--demo-h);z-index:20;background:var(--bg);margin:0 -20px 16px;padding:12px 20px 0;border-bottom:1px solid var(--border)}
.wh .l1{display:flex;align-items:center;gap:12px;min-height:44px}
.wh h1{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:800;margin-right:auto}
.wh .mlogo{display:none}
.tabs2{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{min-height:44px;font-weight:600;font-size:14px;color:var(--text-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs2 button:hover{color:var(--text)}
.tabs2 button[aria-selected=true]{color:var(--text);border-color:var(--primary)}
.srch{position:relative;display:block}
.srch .ic{position:absolute;left:12px;top:50%;margin-top:-10px;color:var(--text-3);pointer-events:none}
.srch input{padding-left:40px;min-height:44px;border-radius:var(--radius-full);background:var(--surface-2);border-color:var(--border)}
.wh .srch{width:240px}
.right{display:none;position:sticky;top:var(--demo-h);height:calc(100vh - var(--demo-h));overflow:auto;padding:20px 0 20px 4px;flex-direction:column;gap:16px;border-left:1px solid var(--border);padding-left:16px;padding-right:0}
.right h2{font-size:15px;line-height:22px;font-weight:700;margin-bottom:8px}
.right .card{padding:16px}
.rtr{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:8px;border-radius:var(--radius-sm);font-size:14px;line-height:20px}
.rtr:hover{background:var(--surface-2)}
.rtr small{display:block;font-size:12px;color:var(--text-3)}
.rtr .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

@media(min-width:768px){
  .side .lk{display:none}
}
@media(min-width:1024px){
  .app{grid-template-columns:240px minmax(0,1fr) 320px}
  .side{padding:20px 16px}
  .side .logo span.t{display:inline}
  .side .lb{display:inline}
  .side .lk{display:flex}
  .right{display:flex}
  .wh .srch.mob{display:none}
}
@media(max-width:1023px){.wh .srch{width:200px}}
@media(max-width:767px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:0 16px 96px}
  .wh{margin:0 -16px 12px;padding:8px 16px 0}
  .wh .mlogo{display:flex}
  .wh h1{display:none}
  .wh .srch{width:auto;flex:1}
}
@media(min-width:640px) and (max-width:767px){.col-c{max-width:600px}}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);background:var(--surface);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.bnav a,.bnav button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:14px;color:var(--text-3);font-weight:500;border-radius:var(--radius-md);text-decoration:none}
.bnav [aria-current=page]{color:var(--primary);font-weight:700}
.bnav [aria-current=page] .ic{stroke-width:2.1}
@media(max-width:767px){.bnav{display:grid}}

/* nút ngữ cảnh feed */

.rx button{padding:4px 0}
.rx button .c{font-size:12px;line-height:14px;font-variant-numeric:tabular-nums}
.rx button[data-tip]:hover::after,.rx button[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);padding:6px 10px;border-radius:var(--radius-sm);font-size:12px;line-height:16px;white-space:nowrap;z-index:10;pointer-events:none;font-weight:600}

.rx button:last-child[data-tip]:hover::after,.rx button:last-child[data-tip]:focus-visible::after{left:auto;right:0;transform:none}
.rxcap{display:flex;justify-content:space-between;gap:8px}
.rxcap b{color:var(--on-secondary-soft);font-weight:700}
.act button[aria-expanded=true]{background:var(--surface-2)}
.cmts{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.cm{align-items:flex-start}
.cm .cb{flex:1;min-width:0}
.cm .b{display:block;overflow-wrap:anywhere}

.sw2{border:0}
.banner{margin-bottom:12px}
.banner svg{flex-shrink:0;margin-top:2px}
.banner .b2{flex:1;min-width:0}

.tabs-seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:var(--radius-md)}

.cfw{position:absolute;inset:0;overflow:hidden;pointer-events:none}

@media(max-width:767px){#toasts{left:16px;right:16px;bottom:76px;max-width:none;align-items:stretch}}

.hist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}

/* landing */

function trendBody() {
  const ls = loadState("trend"); if (ls) return ls;
  const V = S.posts.filter(p => p.status === "visible" && !S.me.blocked.includes(p.aid));
  const top = f => V.slice().sort((a, b) => f(b) - f(a)).slice(0, 4).map(postHTML).join("");
  if (S.trendTab === "vía") return top(totalR);

function jCalc(j) {
  const repaid = j.pays.reduce((a, b) => a + b.a, 0), left = Math.max(0, j.initial - repaid);
  return { repaid, left, pct: Math.min(100, repaid / j.initial * 100) };
}

  <section class="card panel" aria-labelledby="jt"><h3 id="jt">${esc(j.title)}</h3>
   <div class="kv"><div><small>Tổng nợ ban đầu</small><b>${vnd(j.initial)}</b></div><div><small>Đã trả</small><b>${vnd(c.repaid)}</b></div><div><small>Còn lại</small><b>${vnd(c.left)}</b></div></div>

/* ----- Quản trị ----- */
const ST = { open: "Chờ xử lý", hidden: "Đã ẩn nội dung", kept: "Đã giữ lại" };
function tgt(r) { return r.type === "post" ? S.posts.find(p => p.id === r.tid) : S.comments.find(c => c.id === r.tid); }
function slaHTML(r) {
  if (r.status !== "open") return `<span class="sla dn">${ST[r.status]}</span>`;
